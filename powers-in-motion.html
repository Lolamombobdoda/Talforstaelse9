.lbar.cA,.lpath.cA{stroke:var(--cA)} .lbar.cB,.lpath.cB{stroke:var(--cB)} .lbar.cF,.lpath.cF{stroke:var(--cF)} .lbar.cO,.lpath.cO{stroke:var(--cO)}

<script>
const NS='http://www.w3.org/2000/svg', CANCEL=Symbol('cancel');
const RM=false;
const CX=360, CW=.62;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=t=>Math.max(0,Math.min(1,t));
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ───────── expression trees ───────── */
const num=(t,key,cls)=>({t:'n',text:String(t),key,cls:cls||''});
const opr=(t,key,cls)=>({t:'o',text:t,key,cls:cls||''});
const cellN=(w,ch)=>({t:'c',w,ch});
const row=(...ch)=>({t:'r',ch:ch.flat(9).filter(Boolean)});
function frc(a,b,key,cls){ cls=cls||''; if(typeof a!=='object') a=num(a,key+'n',cls); if(typeof b!=='object') b=num(b,key+'d',cls); return {t:'f',nu:a,de:b,key,cls}; }
const pw=(b,e)=>({t:'p',b,e});                                 // power: base with a raised exponent
const brc=(c,lab,dir,key,cls)=>({t:'B',c,lab,dir,key,cls:cls||''}); // under- ('u') or overbrace ('o') with a count
const par=(c,key)=>({t:'P',c,key});                            // brackets that grow to fit
const strike=n=>({...n,strike:true});
const isV=x=>typeof x==='string'&&/^[a-z]$/.test(x);
const V=(t,key,cls)=>num(t,key,((cls||'')+' it').trim());
const N=(x,key,cls)=>isV(x)?V(x,key,cls):num(x,key,cls);
const X=(e,key,cls)=>typeof e==='object'?e:N(e,key,cls);

const ks=k=>k!=null?k:undefined;
function shift(l,dx,dy){ const q={...l};
  if(q.kind==='p'){ q.x1+=dx; q.x2+=dx; q.y1+=dy; q.y2+=dy; }
  else { if(q.kind==='b'){ q.x1+=dx; q.x2+=dx; } else q.x+=dx; q.y+=dy; }
  return q; }
function lay(node,s){
  if(node.t==='o'&&node.text==='/'){   // division: a large slash
    const k=1.55, tw=CW*k*s, pad=.1*s, sh=.2*s;
    return {w:tw+2*pad,asc:.74*k*s-sh,desc:sh+.06*s,leaves:[{key:node.key,kind:'t',text:'/',cls:node.cls,x:pad+tw/2,y:sh,s:k*s}]};
  }
  if(node.t==='n'||node.t==='o'){
    const ell=node.text==='⋯', tw=(ell?1.3:[...node.text].length)*CW*s, pad=node.t==='o'?((node.text==='·'||ell)?.14:.34)*s:0;
    const leaves=[{key:node.key,kind:'t',text:node.text,cls:node.cls,x:pad+tw/2,y:0,s}];
    if(node.strike) leaves.push({key:node.key!=null?node.key+'.x':undefined,kind:'p',shape:'x',cls:'',x1:pad-.14*s,x2:pad+tw+.14*s,y1:.12*s,y2:-.84*s,s});
    return {w:tw+2*pad,asc:.74*s,desc:.06*s,leaves};
  }
  if(node.t==='c'){
    if(!node.ch) return {w:node.w,asc:0,desc:0,leaves:[]};
    const L=lay(node.ch,s); return {w:node.w,asc:L.asc,desc:L.desc,leaves:L.leaves.map(l=>shift(l,(node.w-L.w)/2,0))};
  }
  if(node.t==='r'){
    let x=0,asc=0,desc=0; const leaves=[];
    for(const ch of node.ch){ const L=lay(ch,s); for(const l of L.leaves) leaves.push(shift(l,x,0)); x+=L.w; asc=Math.max(asc,L.asc); desc=Math.max(desc,L.desc); }
    return {w:x,asc,desc,leaves};
  }
  if(node.t==='p'){
    const B=lay(node.b,s), es=.62*s, E=lay(node.e,es), rise=Math.max(.4*s,B.asc-.5*es), gx=.04*s;
    return {w:B.w+gx+E.w+.05*s,asc:Math.max(B.asc,rise+E.asc),desc:Math.max(B.desc,E.desc-rise),
      leaves:[...B.leaves,...E.leaves.map(l=>shift(l,B.w+gx,-rise))]};
  }
  if(node.t==='B'){
    const C=lay(node.c,s), ls=Math.max(.62*s,16), Lb=lay(node.lab,ls), w=Math.max(C.w,Lb.w), cx=(w-C.w)/2, lx=(w-Lb.w)/2;
    const g=.14*s, bh=.3*s, ins=.05*s, leaves=C.leaves.map(l=>shift(l,cx,0)), key=node.key!=null?node.key+'.br':undefined;
    if(node.dir==='u'){
      const y1=C.desc+g, y2=y1+bh, yl=y2+.14*s+Lb.asc;
      leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
      Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
      return {w,asc:C.asc,desc:yl+Lb.desc,leaves};
    }
    const y1=-C.asc-g, y2=y1-bh, yl=y2-.14*s-Lb.desc;
    leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
    Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
    return {w,asc:-yl+Lb.asc,desc:C.desc,leaves};
  }
  if(node.t==='P'){
    const C=lay(node.c,s), pw_=.36*s, asc=Math.max(C.asc,.74*s)+.1*s, desc=Math.max(C.desc,.06*s)+.16*s, kk=node.key;
    const leaves=C.leaves.map(l=>shift(l,pw_,0));
    leaves.push({key:kk!=null?kk+'.pl':undefined,kind:'p',shape:'pl',cls:'',x1:.05*s,x2:pw_-.02*s,y1:-asc,y2:desc,s});
    leaves.push({key:kk!=null?kk+'.pr':undefined,kind:'p',shape:'pr',cls:'',x1:pw_+C.w+.02*s,x2:2*pw_+C.w-.05*s,y1:-asc,y2:desc,s});
    return {w:C.w+2*pw_,asc,desc,leaves};
  }
  const T=lay(node.nu,s), B=lay(node.de,s), pad=.24*s, gap=(node.gap??.2)*s, ax=.3*s, w=Math.max(T.w,B.w)+2*pad;
  const yT=-ax-gap-T.desc, yB=-ax+gap+B.asc, leaves=[];
  for(const l of T.leaves) leaves.push(shift(l,(w-T.w)/2,yT));
  for(const l of B.leaves) leaves.push(shift(l,(w-B.w)/2,yB));
  leaves.push({key:node.key!=null?node.key+'.bar':undefined,kind:'b',cls:node.cls,x1:pad*.4,x2:w-pad*.4,y:-ax,s});
  return {w,asc:-yT+T.asc,desc:yB+B.desc,leaves};
}
function pathD(l){
  const {x1,x2,y1,y2}=l, ym=(y1+y2)/2;
  if(l.shape==='x') return `M${x1} ${y1}L${x2} ${y2}`;
  if(l.shape==='pl') return `M${x2} ${y1}Q${2*x1-x2} ${ym} ${x2} ${y2}`;
  if(l.shape==='pr') return `M${x1} ${y1}Q${2*x2-x1} ${ym} ${x1} ${y2}`;
  const xm=(x1+x2)/2, q=Math.min(Math.abs(y2-y1)*.9,(x2-x1)/4);
  return `M${x1} ${y1}Q${x1} ${ym} ${x1+q} ${ym}L${xm-q} ${ym}Q${xm} ${ym} ${xm} ${y2}Q${xm} ${ym} ${xm+q} ${ym}L${x2-q} ${ym}Q${x2} ${ym} ${x2} ${y1}`;
}
const klassOf=l=>(l.kind==='t'?'lf ':l.kind==='b'?'lbar ':'lpath ')+l.cls;
function mkLeaf(parent,l){
  const e=el(l.kind==='t'?'text':l.kind==='b'?'line':'path',{class:klassOf(l)},parent);
  if(l.kind==='t'){ e.setAttribute('text-anchor','middle'); e.textContent=l.text; }
  setLeaf(e,l); return e;
}
function setLeaf(e,l){
  if(l.kind==='t'){ e.setAttribute('x',l.x); e.setAttribute('y',l.y); e.setAttribute('font-size',l.s); }
  else if(l.kind==='b'){ e.setAttribute('x1',l.x1); e.setAttribute('x2',l.x2); e.setAttribute('y1',l.y); e.setAttribute('y2',l.y); e.setAttribute('stroke-width',Math.max(1.6,l.s*.07)); }
  else { e.setAttribute('d',pathD(l)); e.setAttribute('stroke-width',Math.max(1.6,l.s*(l.shape==='br'?.06:.075))); }
}
function mixLeaf(a,b,t,dx,dy){
  const q={...b};
  if(b.kind==='t'){ q.x=lerp(a.x,b.x,t)+(dx||0); q.y=lerp(a.y,b.y,t)+(dy||0); q.s=lerp(a.s,b.s,t); }
  else if(b.kind==='b'){ q.x1=lerp(a.x1,b.x1,t); q.x2=lerp(a.x2,b.x2,t); q.y=lerp(a.y,b.y,t); }
  else { q.x1=lerp(a.x1,b.x1,t); q.x2=lerp(a.x2,b.x2,t); q.y1=lerp(a.y1,b.y1,t); q.y2=lerp(a.y2,b.y2,t); q.s=lerp(a.s,b.s,t); }
  return q;
}
const sameLeaf=(a,b)=>a.kind==='t'?(a.x===b.x&&a.y===b.y&&a.s===b.s):a.kind==='b'?(a.x1===b.x1&&a.x2===b.x2&&a.y===b.y):(a.x1===b.x1&&a.x2===b.x2&&a.y1===b.y1&&a.y2===b.y2);
const mid=l=>l.kind==='t'?[l.x,l.y-.32*l.s]:l.kind==='b'?[(l.x1+l.x2)/2,l.y]:[(l.x1+l.x2)/2,(l.y1+l.y2)/2];

/* products:  a · a · a  or  a · a · ⋯ · a · a  (ids ending in 'e' are the dots ⋯) */
const isE=id=>id.endsWith('e');
const SL=c=>typeof c==='number'?[...Array(c)].map((_,i)=>String(i)):['0','1','e','3','4'];
function prod(P,ids,fac,sep){ const out=[]; ids.forEach((id,i)=>{ if(i) out.push(sep?sep(ids[i-1]):opr('·',P+'m'+ids[i-1])); out.push(isE(id)?opr('⋯',P+id):fac(id)); }); return row(out); }
const W=(node,s)=>lay(node,s).w;
const ph=(node,s)=>cellN(W(node,s));
const cps=(P,ids,src)=>Object.fromEntries(ids.filter(i=>!isE(i)).map(i=>[P+i,src]));
// numerator and denominator padded on the left to one width, so matching factors stand straight above each other at the right
const G=f=>({...f,gap:.42});   // roomier fraction for long rows of factors
function fracL(T,B,key,s){ const a=W(T,s), b=W(B,s); return G(frc(row(a<b?cellN(b-a):null,T),row(b<a?cellN(a-b):null,B),key)); }

/* ───────── stage + animation context ───────── */
class Stage{
  constructor(svg){ this.svg=svg; this.gen=0; this.introDone=false; this.acc=0; this.pausedAt=null; }
  now(){ return (this.pausedAt??performance.now())-this.acc; }
  pause(){ if(this.pausedAt==null) this.pausedAt=performance.now(); }
  resume(){ if(this.pausedAt!=null){ this.acc+=performance.now()-this.pausedAt; this.pausedAt=null; } }
  get paused(){ return this.pausedAt!=null; }
  play(script,keep,focus){
    this.resume(); this.onplay&&this.onplay(!!focus);
    const gen=++this.gen; if(!keep) this.introDone=false; this.instant=false; this.svg.textContent='';
    this.L={}; for(const k of ['marks','eq','fx']) this.L[k]=el('g',{},this.svg);
    return script(new Ctx(this,gen)).catch(e=>{ if(e!==CANCEL) console.error(e); })
      .finally(()=>{ if(this.gen===gen&&focus&&this.onend) this.onend(); });
  }
}
class Ctx{
  constructor(st,gen){ this.st=st; this.gen=gen; this.cur=new Map(); this.lines={}; }
  /* everything runs on the stage clock, which stands still while paused */
  run(d,fn,raw){
    const st=this.st, gen=this.gen;
    return new Promise((res,rej)=>{
      if(st.gen!==gen) return rej(CANCEL);
      if(d<=0){ fn&&fn(1); return res(); }
      const t0=st.now();

  wiggle(keys,dur=1400){
    const items=keys.map(k=>this.cur.get(k)).filter(Boolean); if(!items.length) return Promise.resolve();
    const ps=items.map(c=>mid(c.spec)), xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]);
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    return this.tw(dur,t=>{
      const k=1+.09*Math.sin(Math.PI*t), a=4*Math.sin(4*Math.PI*t)*Math.sin(Math.PI*t);
      items.forEach(c=>c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) rotate(${a}) scale(${k}) translate(${-cx} ${-cy})`));
    });
  }
  /* grow briefly and glow a little, then settle back */
  glow(key,dur=1000){
    const c=this.cur.get(key); if(!c) return Promise.resolve(); const [cx,cy]=mid(c.spec);
    return this.tw(dur,t=>{ const p=Math.sin(Math.PI*t), k=1+.6*p;
      c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`);
      c.el.style.filter=t>=1?'':`drop-shadow(0 0 ${6*p}px var(--cF))`; });
  }
  all(...ps){ return Promise.all(ps); }
  cfg(line,c){ this.lines[line]=c; }

  async begin(tree,c){
    const def={cx:CX,y:92,s:34}, intro=this.st.introDone; this.st.introDone=false;
    if(intro){
      this.cfg('main',def); const sv=this.st.instant; this.st.instant=true; await this.show('main',tree); this.st.instant=sv;
      if(c){ this.cfg('main',c); await this.show('main',tree,{dur:1200}); }
      await this.wait(500);
    } else { this.cfg('main',c||def); await this.show('main',tree); await this.wait(900); }
  }

  /* morph one line of math into a new tree: shared keys glide, changed numbers crossfade, copies grow out of their originals, new parts fade in last */
  async show(line,tree,op={}){
    const cfg=this.lines[line]||(this.lines[line]={cx:CX,y:92,s:34});
    const Lt=lay(tree,cfg.s), x0=cfg.cx-Lt.w/2;
    const next=new Map(); for(const l of Lt.leaves) if(l.key!=null) next.set(l.key,shift(l,x0,cfg.y));
    const P=this.st.L.eq, A=[], C=[], fins=[], drop=[], copies=[];
    const cv=k=>{ const v=op.curve&&op.curve[k]; return typeof v==='number'?[v,0]:v?[v.x||0,v.y||0]:[0,0]; };
    const klass=(spec,dim)=>klassOf(spec)+(dim?' dim':'');
    for(const [k,spec] of next){
      const c=this.cur.get(k);
      if(c){
        const from=c.spec, dim=c.el.classList.contains('dim'), [rx,ry]=cv(k);
        if(spec.kind==='t'&&spec.text!==from.text){
          const oe=c.el, ne=mkLeaf(P,{...from,text:spec.text}); ne.setAttribute('class',klass(spec,dim)); ne.setAttribute('opacity',0);
          A.push(t=>{ const m=mixLeaf(from,spec,t,rx*Math.sin(Math.PI*t),ry*Math.sin(Math.PI*t)); setLeaf(oe,m); setLeaf(ne,m); oe.setAttribute('opacity',1-t); ne.setAttribute('opacity',t); });
          drop.push(oe); c.el=ne;
        } else {

          if(!sameLeaf(from,spec)){ const e=c.el; A.push(t=>setLeaf(e,mixLeaf(from,spec,t,rx*Math.sin(Math.PI*t),ry*Math.sin(Math.PI*t)))); }
        }
        c.spec=spec; c.line=line;
      } else {
        const sk=op.from&&op.from[k];
        if(sk) copies.push([k,spec,sk]);
        else { const e=mkLeaf(P,spec); e.setAttribute('opacity',0); fins.push({e,spec}); this.cur.set(k,{el:e,spec,line}); }
      }
    }
    const gone=[], goneSpec=new Map();
    for(const [k,c] of this.cur) if(c.line===line&&!next.has(k)){ const o=c.el.getAttribute('opacity'); gone.push([c.el,o==null?1:+o]); goneSpec.set(k,c.spec); this.cur.delete(k); }

    if(A.length||gone.length) await this.tw(op.dur??1000,t=>{ A.forEach(fn=>fn(t)); gone.forEach(([e,o])=>e.setAttribute('opacity',o*(1-t))); });
    gone.forEach(([e])=>e.remove()); drop.forEach(e=>e.remove());
    // 2: copies grow out of the settled originals
    for(const [k,spec,sk] of copies){
      const src=(this.cur.get(sk)||{}).spec||goneSpec.get(sk);
      if(!src||src.kind!==spec.kind){ const e=mkLeaf(P,spec); e.setAttribute('opacity',0); fins.push({e,spec}); this.cur.set(k,{el:e,spec,line}); continue; }
      const start=spec.kind==='t'?{...spec,x:src.x,y:src.y,s:src.s}:spec.kind==='b'?{...spec,x1:src.x1,x2:src.x2,y:src.y}:{...spec,x1:src.x1,x2:src.x2,y1:src.y1,y2:src.y2};
      const e=mkLeaf(P,start), [rx,ry]=cv(k); e.setAttribute('opacity',0);
      C.push(t=>{ setLeaf(e,mixLeaf(start,spec,t,rx*Math.sin(Math.PI*t),ry*Math.sin(Math.PI*t))); e.setAttribute('opacity',Math.min(1,t*1.5)); });
      this.cur.set(k,{el:e,spec,line});
    }
    const side=op.during?op.during():null;
    if(C.length) await this.tw(op.dur2??op.dur??1100,t=>C.forEach(fn=>fn(t)));
    // 3: brand-new parts fade in; a brace grows out from its middle, a strike is drawn
    fins.forEach(({e,spec})=>{ if(spec.shape==='x'){ e.setAttribute('pathLength',1); e.setAttribute('stroke-dasharray','1 2'); e.setAttribute('stroke-dashoffset',1); } });
    if(fins.length) await this.tw(op.fade??850,t=>fins.forEach(({e,spec})=>{
      if(spec.shape==='x'){ e.setAttribute('opacity',t>0?1:0); e.setAttribute('stroke-dashoffset',1-t); }
      else if(spec.shape==='br'){ const xm=(spec.x1+spec.x2)/2; setLeaf(e,{...spec,x1:lerp(xm,spec.x1,t),x2:lerp(xm,spec.x2,t)}); e.setAttribute('opacity',Math.min(1,t*2)); }
      else e.setAttribute('opacity',t); }));
    if(side) await side;
  }
  focus(keys){ const set=keys?new Set(keys):null; for(const [k,c] of this.cur) c.el.classList.toggle('dim',!!set&&!set.has(k)); }
  async floatGroup(keys,to,op={}){
    const items=keys.map(k=>this.cur.get(k)).filter(Boolean); if(!items.length) return;
    const ps=items.map(c=>mid(c.spec)), xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]);
    const dx=to.x-(Math.min(...xs)+Math.max(...xs))/2, dy=to.y-(Math.min(...ys)+Math.max(...ys))/2;
    const cl=items.map(c=>{ const e=mkLeaf(this.st.L.fx,c.spec); return {e,a:c.spec,b:shift(c.spec,dx,dy)}; });
    await this.tw(op.dur??1200,t=>cl.forEach(q=>{ setLeaf(q.e,mixLeaf(q.a,q.b,t)); q.e.setAttribute('opacity',.55*(t<.8?Math.min(1,t*5):(1-t)/.2)); }));
    cl.forEach(q=>q.e.remove());
  }
  fadeIn(els,dur=800){ els=[].concat(els).filter(Boolean); els.forEach(e=>e.setAttribute('opacity',0)); return this.tw(dur,t=>els.forEach(e=>e.setAttribute('opacity',t))); }
  async fadeOut(els,dur=800){ els=[].concat(els).filter(Boolean); await this.tw(dur,t=>els.forEach(e=>e.setAttribute('opacity',1-t))); els.forEach(e=>e.remove()); }
}

/* ───────── 1 · repeated multiplication ───────── */

async function runRep(S,E){
  const s=34, P0=pw(N(E.a,'pb','cA'),X(E.m,'pe','cF')), ids=SL(E.m), fac=id=>N(E.a,'f'+id,'cA');

/* dots: a row of a, then that picture copied a times, again and again */
function dotPos(B,k,p){
  let pts=[...Array(B)].map((_,i)=>[i*p,0]), w=(B-1)*p, h=0;
  for(let L=2;L<=k;L++){ const vert=L%2===0, g=(vert?h:w)+p+(L>=3?16:0), np=[];
    for(let j=0;j<B;j++) for(const [x,y] of pts) np.push(vert?[x,y+j*g]:[x+j*g,y]);
    if(vert) h+=(B-1)*g; else w+=(B-1)*g; pts=np; }
  return {pts,w,h};
}

    await S.floatGroup(['v'+(k-1)],{x:CX,y:cy},{dur:1100});

    await S.all(S.tw(1500,t=>{

      S.show('ev',ev(k),{dur:1400}));

  }

/* ───────── 3–5 · a^m / a^n ───────── */
const startDiv=E=>frc(pw(N(E.a,'tb','cA'),X(E.m,'te','cF')),pw(N(E.a,'bb','cA'),X(E.n,'be',E.cn||'cO')),'M');

/* a factor above meets its partner below, they become 1, and the 1 fades away */
async function pairOne(S,kt,kb,extra,keep){
  const ct=S.cur.get(kt), cb=S.cur.get(kb), bar=S.cur.get('W.bar').spec, s=ct.spec.s, L=S.st.L.fx;

/* behind the dots ⋯ : many pairs meet and vanish quickly, overlapping */

    const R=iT.filter(i=>!pairs.includes(i)), lab=row(X(E.m,'wTl','cF'),opr('−','wlm'),X(E.n,'wBl',cn));
    const top=brc(prod('wT',R,fac('wT')),lab,'o','wTb');
    await S.all(S.show('w',wl(G(frc(top,one,'W'))),{dur:1300}),bgOut()); await S.wait(1100);
    await S.show('w',wl(top),{dur:1200}); await S.wait(1000);
    await S.show('main',row(M0,opr('=','mq'),pw(N(a,'mb','cA'),eT)),{from:{mb:'wT'+R[0],me1:'wTl',mem:'wlm',me2:'wBl'},dur:1300});
    if(numeric){ await S.wait(900); await S.show('main',row(M0,opr('=','mq'),pw(N(a,'mb','cA'),eT),opr('=','mq2'),pw(N(a,'mc','cA'),num(E.m-E.n,'mv'))),{from:{mc:'mb'}}); }
    return;
  }
  if(rel==='='){
    await S.all(S.show('w',wl(one),{dur:1300}),bgOut()); await S.wait(1000);
    await S.show('main',row(M0,opr('=','mq'),pw(N(a,'mb','cA'),eT)),{from:{mb:'tb',me1:'te',me2:'be'},dur:1300}); await S.wait(900);
    await S.show('main',row(M0,opr('=','mq'),pw(N(a,'mb','cA'),eT),opr('=','mq2'),pw(N(a,'mc','cA'),num(0,'mv'))),{from:{mc:'mb'}}); await S.wait(1000);
    // so a⁰ and 1 are the same thing
    await S.show('r',row(pw(N(a,'rb','cA'),num(0,'rz')),opr('=','rq'),num(1,'r1')),{from:{rb:'mc',rz:'mv',r1:'w1'},dur:1300});
    await S.wait(500); await S.wiggle(['rb','rz','rq','r1']);
    if(isV(a)) await noZero(S,a);
    return;
  }
  // more below than above: a 1 stays on top
  const R=iB.filter(i=>!pairs.includes(i)), lab=row(X(E.n,'wBl',cn),opr('−','wlm'),X(E.m,'wTl','cF')), k0='wB'+R[0];
  await S.all(S.show('w',wl(G(frc(one,brc(prod('wB',R,fac('wB')),lab,'u','wBb'),'W'))),{dur:1300}),bgOut()); await S.wait(1100);
  await S.show('w',wl(frc(one,pw(N(a,k0,'cA'),lab),'W')),{dur:1300}); await S.wait(900);
  const k=numeric?E.n-E.m:null;
  if(numeric){ await S.show('w',wl(frc(one,pw(N(a,k0,'cA'),num(k,'wBl')),'W'))); await S.wait(900); }
  await S.show('main',row(M0,opr('=','mq'),pw(N(a,'mb','cA'),eT)),{from:{mb:'tb',me1:'te',me2:'be'},dur:1300}); await S.wait(900);
  if(numeric){ await S.show('main',row(M0,opr('=','mq'),pw(N(a,'mb','cA'),eT),opr('=','mq2'),pw(N(a,'mc','cA'),num('−'+k,'mv'))),{from:{mc:'mb'}}); await S.wait(1000); }
  // a negative exponent: divide by a, again and again
  const ids=SL(numeric?k:'v');
  const chain=brc(row(ids.map(id=>[opr('/','rs'+id),isE(id)?opr('⋯','ra'+id):N(a,'ra'+id,'cA')])),
    numeric?num(k,'rl'):row(V('n','rl1',cn),opr('−','rlm'),V('m','rl2','cF')),'u','rlb');
  const left=numeric?pw(N(a,'rb','cA'),num('−'+k,'rz')):pw(N(a,'rb','cA'),row(V('m','rz1','cF'),opr('−','rzm'),V('n','rz2',cn)));
  const from={r1:'w1',...cps('ra',ids,k0),...(numeric?{rb:'mc',rz:'mv',rl:'wBl'}:{rb:'mb',rz1:'me1',rzm:'mem',rz2:'me2',rl1:'wBl',rlm:'wlm',rl2:'wTl'})};
  await S.show('r',row(left,opr('=','rq'),num(1,'r1'),chain),{from,dur:1400});
  await S.wait(1600);
  // and back together: one over a to the power
  const ex2=numeric?num(k,'rl'):row(V('n','rl1',cn),opr('−','rlm'),V('m','rl2','cF'));
  await S.show('r',row(left,opr('=','rq'),frc(num(1,'r1'),pw(N(a,'ra0','cA'),ex2),'rF')),{dur:1500});
}

/* a note that a must not be 0: it pulses between ink and red, and stays red */
async function noZero(S,a){
  S.cfg('nz',{cx:575,y:442,s:28}); await S.wait(600);
  await S.show('nz',row(V(a,'nza'),opr('≠','nzq'),num(0,'nz0')),{fade:800});
  const cs=['nza','nzq','nz0'].map(k=>S.cur.get(k)), ps=cs.map(c=>mid(c.spec)), cx=(ps[0][0]+ps[2][0])/2, cy=ps[1][1];
  await S.tw(3600,t=>{ const u=t*3, p=Math.sin(Math.PI*(u%1)), red=u>=2.5?1:p, k=1+.14*p;
    cs.forEach(c=>{ c.el.style.fill=`color-mix(in srgb, var(--cR) ${Math.round(red*100)}%, var(--ink))`;
      c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`); }); },true);
}

/* ───────── 6 · a^m · b^m ───────── */
const startPM=E=>row(pw(N(E.a,'ab','cA'),X(E.m,'ae','cF')),opr('·','mo'),pw(N(E.b,'bb','cB'),X(E.m,'be','cF')));
async function runPM(S,E){
  const s=30, ids=SL(E.m), M0=startPM(E), numeric=typeof E.a==='number';
  await S.begin(M0,{cx:CX,y:92,s:34}); S.cfg('w',{cx:CX,y:228,s}); S.cfg('r',{cx:CX,y:396,s:34});
  const fA=id=>N(E.a,'wA'+id,'cA'), fB=id=>N(E.b,'wB'+id,'cB');
  const gA=brc(prod('wA',ids,fA),X(E.m,'wAl','cF'),'u','wAb','cF'), gB=brc(prod('wB',ids,fB),X(E.m,'wBl','cF'),'u','wBb','cF');
  await S.show('w',row(opr('=','we'),gA,opr('·','wo'),ph(gB,s)),{from:{...cps('wA',ids,'ab'),wAl:'ae',wo:'mo'},dur:1300});
  await S.wait(800);
  await S.show('w',row(opr('=','we'),gA,opr('·','wo'),gB),{from:{...cps('wB',ids,'bb'),wBl:'be'},dur:1300});
  await S.wait(1400);
  // change the order: every a gets a b beside it
  const inner=id=>ids.indexOf(id)<ids.length-1?'wBm'+id:'wo';
  const seq=paren=>row(ids.map((id,i)=>[i?opr('·','wAm'+ids[i-1]):null,
    isE(id)?opr('⋯','wAe'):(r=>paren?par(r,'wP'+id):r)(row(fA(id),opr('·',inner(id)),fB(id)))]));
  const curve=Object.fromEntries(ids.filter(i=>!isE(i)).map(i=>['wB'+i,{y:42}]));
  await S.show('w',row(opr('=','we'),brc(seq(false),X(E.m,'wAl','cF'),'u','wAb','cF')),{dur:1900,curve});
  await S.wait(900);
  await S.show('w',row(opr('=','we'),brc(seq(true),X(E.m,'wAl','cF'),'u','wAb','cF')),{dur:1100});
  await S.wait(1300);
  const pr=par(row(N(E.a,'ra','cA'),opr('·','rd'),N(E.b,'rbb','cB')),'rP');
  await S.show('r',row(opr('=','re'),pw(pr,X(E.m,'rl','cF'))),{from:{ra:'wA0',rd:inner('0'),rbb:'wB0','rP.pl':'wP0.pl','rP.pr':'wP0.pr',rl:'wAl'},dur:1300});
  if(numeric){ await S.wait(1000); await S.show('r',row(opr('=','re'),pw(pr,X(E.m,'rl','cF')),opr('=','rq'),pw(num(E.a*E.b,'rv'),X(E.m,'rl2','cF'))),{from:{rl2:'rl'}}); }
}

/* ───────── 7 · a^m / b^m ───────── */
const startPD=E=>frc(pw(N(E.a,'tb','cA'),X(E.m,'te','cF')),pw(N(E.b,'bb','cB'),X(E.m,'be','cF')),'M');
async function runPD(S,E){
  const s=30, ids=SL(E.m), M0=startPD(E);
  await S.begin(M0,{cx:CX,y:92,s:34}); S.cfg('w',{cx:CX,y:278,s}); S.cfg('r',{cx:CX,y:440,s:32});
  const T=brc(prod('wT',ids,id=>N(E.a,'wT'+id,'cA')),X(E.m,'wTl','cF'),'o','wTb','cF');
  const B=brc(prod('wB',ids,id=>N(E.b,'wB'+id,'cB')),X(E.m,'wBl','cF'),'u','wBb','cF');
  await S.show('w',row(opr('=','we'),G(frc(T,ph(B,s),'W'))),{from:{...cps('wT',ids,'tb'),wTl:'te'},dur:1300});
  await S.wait(800);
  await S.show('w',row(opr('=','we'),G(frc(T,B,'W'))),{from:{...cps('wB',ids,'bb'),wBl:'be'},dur:1300});
  await S.wait(1400);
  // each a keeps its own b underneath: one small fraction per pair
  const seq=row(ids.map((id,i)=>[i?opr('·','wTm'+ids[i-1]):null,isE(id)?opr('⋯','wTe'):frc(N(E.a,'wT'+id,'cA'),N(E.b,'wB'+id,'cB'),'wF'+id)]));
  await S.show('w',row(opr('=','we'),brc(seq,X(E.m,'wBl','cF'),'u','wBb','cF')),{dur:1600});
  await S.wait(1300);
  await S.show('r',row(opr('=','re'),pw(par(frc(N(E.a,'ra','cA'),N(E.b,'rbb','cB'),'rF'),'rP'),X(E.m,'rl','cF'))),
    {from:{ra:'wT0',rbb:'wB0','rF.bar':'wF0.bar',rl:'wBl'},dur:1300});
}

/* ───────── 8 · (a^m)^n ───────── */
const startPP=E=>row(pw(par(pw(N(E.a,'ib','cA'),X(E.m,'ie','cF')),'mP'),X(E.n,'oe','cO')));
async function runPP(S,E){
  const ids=SL(E.n), M0=startPP(E), numeric=typeof E.m==='number';
  await S.begin(M0,{cx:CX,y:92,s:34}); S.cfg('w',{cx:CX,y:228,s:32}); S.cfg('r',{cx:CX,y:392,s:38});
  const g=brc(prod('wA',ids,id=>pw(N(E.a,'wA'+id,'cA'),X(E.m,'wA'+id+'x','cF'))),X(E.n,'wl','cO'),'u','wb','cO');
  const from={wl:'oe'}; ids.filter(i=>!isE(i)).forEach(i=>{ from['wA'+i]='ib'; from['wA'+i+'x']='ie'; });
  await S.show('w',row(opr('=','we'),g),{from,dur:1400});
  await S.wait(1400);
  // multiplying powers of a: the exponents add up
  const sum=brc(prod('rE',ids,id=>X(E.m,'rE'+id,'cF'),prev=>opr('+','rEp'+prev)),X(E.n,'rl','cO'),'u','rbb','cO');
  const f2={rb:'wA0',rl:'wl'}; ids.filter(i=>!isE(i)).forEach(i=>{ f2['rE'+i]='wA'+i+'x'; });
  await S.show('r',row(opr('=','re'),pw(N(E.a,'rb','cA'),sum)),{from:f2,dur:1400});
  await S.wait(1400);
  // n copies of m added together = m · n
  const prodE=row(X(E.m,'rE0','cF'),opr('·','rm'),X(E.n,'rl','cO'));
  await S.show('r',row(opr('=','re'),pw(N(E.a,'rb','cA'),prodE)),{dur:1300});
  if(numeric){ await S.wait(1000); await S.show('r',row(opr('=','re'),pw(N(E.a,'rb','cA'),prodE),opr('=','rq'),pw(N(E.a,'rc','cA'),num(E.m*E.n,'rv'))),{from:{rc:'rb'}}); }
}

/* ───────── examples ───────── */
const KIND={
  rep:{start:startRep,run:runRep},
  mul:{start:startMul,run:runMul},
  div:{start:E=>row(startDiv(E)),run:runDiv,methods:['cross','comb']},
  pmul:{start:startPM,run:runPM},
  pdiv:{start:E=>row(startPD(E)),run:runPD},
  pow:{start:startPP,run:runPP},
};
const SECTIONS={
  rep:[['rep',{a:2,m:4,pic:1}],['rep',{a:3,m:3,pic:1}],['rep',{a:'a',m:4}],['rep',{a:'a',m:'m'}],['rep',{a:'a',m:1}]],
  mul:[['mul',{a:2,m:3,n:2}],['mul',{a:3,m:2,n:4}],['mul',{a:'a',m:4,n:3}],['mul',{a:'a',m:'m',n:'n'}]],
  div:[['div',{a:2,m:5,n:3}],['div',{a:3,m:6,n:2}],['div',{a:'a',m:5,n:2}],['div',{a:'a',m:'m',n:'n',rel:'>'}]],
  zero:[['div',{a:5,m:2,n:2}],['div',{a:3,m:4,n:4}],['div',{a:'a',m:3,n:3}],['div',{a:'a',m:'m',n:'m',cn:'cF',rel:'='}]],
  neg:[['div',{a:2,m:2,n:5}],['div',{a:3,m:3,n:5}],['div',{a:'a',m:2,n:6}],['div',{a:'a',m:'m',n:'n',rel:'<'}]],
  pmul:[['pmul',{a:3,b:4,m:2}],['pmul',{a:2,b:5,m:4}],['pmul',{a:'a',b:'b',m:3}],['pmul',{a:'a',b:'b',m:'m'}]],
  pdiv:[['pdiv',{a:2,b:5,m:3}],['pdiv',{a:3,b:2,m:4}],['pdiv',{a:'a',b:'b',m:3}],['pdiv',{a:'a',b:'b',m:'m'}]],
  pow:[['pow',{a:2,m:3,n:2}],['pow',{a:3,m:2,n:4}],['pow',{a:'a',m:4,n:3}],['pow',{a:'a',m:'m',n:'n'}]],
};

/* ───────── static pictures ───────── */
function svgStack(trees,s,gap=4,pad=6){
  const Ls=trees.map(t=>lay(t,s)), w=Math.max(...Ls.map(L=>L.w))+2*pad; let y=pad; const pos=[];
  Ls.forEach(L=>{ y+=L.asc; pos.push(y); y+=L.desc+gap; });
  const h=y-gap+pad, svg=el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,class:'ic','aria-hidden':'true'});
  Ls.forEach((L,i)=>{ const x0=(w-L.w)/2; L.leaves.forEach(l=>mkLeaf(svg,shift(l,x0,pos[i]))); });
  return {svg,w,h};
}
const svgOf=(tree,s,pad)=>svgStack([tree],s,4,pad).svg;
const ICON={
  cross:E=>{ const f=()=>N(E.a,null,'cA'); return svgOf(frc(row(strike(f()),opr('·'),f()),strike(f())),20); },
  comb:E=>{ const f=()=>N(E.a,null,'cA'); return svgOf(row(frc(f(),f()),opr('='),num(1)),20); },
};
function say(n){
  if(n.t==='n'||n.t==='o') return n.text;
  if(n.t==='r') return n.ch.map(say).join(' ');
  if(n.t==='p') return say(n.b)+'^'+(n.e.t==='r'?'('+say(n.e)+')':say(n.e));
  if(n.t==='f') return '('+say(n.nu)+') / ('+say(n.de)+')';
  if(n.t==='P') return '('+say(n.c)+')';
  if(n.t==='B') return say(n.c);
  return '';
}
(function statics(){
  const a=()=>V('a',null,'cA'), b=()=>V('b',null,'cB'), m=()=>V('m',null,'cF'), n=()=>V('n',null,'cO');
  const sum=(...x)=>row(x.flatMap((t,i)=>i?[opr(t.op||'+'),t.n]:[t.n]));
  const ops=svgOf(row(pw(a(),num(1,null,'cF')),cellN(26),pw(a(),num(2,null,'cF')),cellN(26),pw(a(),num(3,null,'cF')),cellN(26),opr('⋯'),cellN(26),pw(a(),m())),64,2);
  document.getElementById('ops').appendChild(ops);
  const two=()=>num(2,null,'cA');
  document.getElementById('legend').appendChild(svgOf(row(brc(row(two(),opr('·'),two(),opr('·'),two()),num(3,null,'cF'),'u',null,'cF'),opr('='),pw(two(),num(3,null,'cF'))),22));
  const G={rep:pw(a(),m()),mul:opr('·'),div:opr('/'),zero:pw(a(),num(0)),neg:pw(a(),row(num('−'),n())),
    pmul:pw(par(row(a(),opr('·'),b())),m()),pdiv:pw(par(frc(a(),b())),m()),pow:pw(par(pw(a(),m())),n())};
  document.querySelectorAll('.sec').forEach(sec=>{
    const t=sec.dataset.sum?opr('='):G[sec.dataset.sec], sv=svgOf(t,44,2);   /* one size for every symbol */ sec.querySelector('.glyph').appendChild(sv); });
  const dotsA=()=>prod('',['0','1','e','3','4'],()=>a());
  const S24=t=>svgOf(t,24);
  const zero=document.createElement('span'); zero.className='rpair';
  zero.append(S24(row(pw(a(),num(0)),opr('='),num(1))),svgOf(row(V('a',null,'cR'),opr('≠',null,'cR'),num(0,null,'cR')),15));
  const R=[
    [S24(row(pw(a(),m()),opr('='),brc(dotsA(),m(),'u',null,'cF')))],
    [S24(row(pw(a(),num(1,null,'cF')),opr('='),a())),zero],
    [S24(row(pw(a(),m()),opr('·'),pw(a(),n()),opr('='),pw(a(),row(m(),opr('+'),n())))),
     S24(row(frc(pw(a(),m()),pw(a(),n())),opr('='),pw(a(),row(m(),opr('−'),n()))))],
    [S24(row(pw(a(),row(num('−'),n())),opr('='),frc(num(1),pw(a(),n())))),
     S24(row(pw(par(pw(a(),m())),n()),opr('='),pw(a(),row(m(),opr('·'),n()))))],
    [S24(row(pw(a(),m()),opr('·'),pw(b(),m()),opr('='),pw(par(row(a(),opr('·'),b())),m()))),
     S24(row(frc(pw(a(),m()),pw(b(),m())),opr('='),pw(par(frc(a(),b())),m())))],
  ];
  const box=document.getElementById('rules');
  R.forEach(items=>{ const d=document.createElement('div'); d.className='rrow'; d.append(...items); box.appendChild(d); });
})();

/* ───────── wiring ───────── */
let last=null, active=null; const stages=[];
// while an animation plays, the rest of the page steps back
let releaseT=null;
let dropT=null;
function setFocus(sec){
  clearTimeout(releaseT); clearTimeout(dropT);
  const prev=active; active=sec;
  if(sec){ document.querySelectorAll('.sec.active').forEach(x=>{ if(x!==sec) x.classList.remove('active'); }); sec.classList.add('active'); }
  // the stage that just played stays on top of the dimmer until the dimmer has faded away
  else if(prev) dropT=setTimeout(()=>prev.classList.remove('active'),2100);
  document.body.classList.toggle('focusing',!!sec);
}
// space bar pauses / resumes the animation that was started last
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||!last||e.target.closest('button,input,textarea')) return;
  e.preventDefault(); last.paused?last.resume():last.pause(); stages.forEach(q=>q.ppShow());
});
document.querySelectorAll('[data-sec]').forEach(sec=>{
  const key=sec.dataset.sec, list=SECTIONS[key], st=new Stage(sec.querySelector('svg.stage'));
  const exBar=sec.querySelector('.exs'), mBar=sec.querySelector('.methods'), rep=sec.querySelector('.replay');
  let cur=null, curM=null; mBar.hidden=true;
  const pp=document.createElement('button'); pp.type='button'; pp.className='replay pp'; rep.before(pp);
  const ICO_PAUSE='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="2" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="5" height="16" rx="1.5" fill="currentColor"/></svg>';
  const ICO_PLAY='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2.5 L16 10 L3 17.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const ppShow=()=>{ pp.innerHTML=st.paused?ICO_PLAY:ICO_PAUSE; pp.setAttribute('aria-label',st.paused?'▶':'❚❚'); pp.setAttribute('aria-pressed',st.paused); };
  pp.addEventListener('click',()=>{ st.paused?st.resume():st.pause(); ppShow(); last=st; });
  st.onplay=focus=>{ last=st; setTimeout(ppShow); setFocus(focus?sec:(active===sec?null:active)); };
  st.onend=()=>{ clearTimeout(releaseT); releaseT=setTimeout(()=>{ if(active===sec) setFocus(null); },1300); };
  const setRep=v=>{ rep.hidden=v; pp.hidden=v; }; setRep(true); stages.push({st,ppShow});
  const exBtns=[]; let mBtns=[];
  const mark=(arr,i)=>arr.forEach((b,j)=>{ b.classList.toggle('on',i===j); b.setAttribute('aria-pressed',i===j); });
  const run=(i,m,keep)=>{ const [k,E]=list[i]; return st.play(S=>KIND[k].run(S,E,m),keep,true); };
  list.forEach(([k,E],i)=>{
    const K=KIND[k], b=document.createElement('button'); b.type='button'; b.id=`ex-${key}-${i}`;
    b.setAttribute('aria-label',say(K.start(E)));
    b.appendChild(svgOf(K.start(E),20));
    b.addEventListener('click',()=>{
      cur=i; curM=null; mark(exBtns,i);
      if(K.methods){
        mBar.textContent=''; mBtns=K.methods.map((m,j)=>{
          const mb=document.createElement('button'); mb.type='button'; mb.id=`m-${key}-${m}`; mb.setAttribute('aria-label',m);
          mb.appendChild(ICON[m](E));
          mb.addEventListener('click',()=>{ curM=m; mark(mBtns,j); setRep(false); run(cur,m,true); });
          mBar.appendChild(mb); return mb; });
        mBar.hidden=false; setRep(true);
        st.play(async S=>{ await S.show('main',K.start(E)); S.st.introDone=true; });
      } else { mBar.hidden=true; setRep(false); run(i,null,false); }
    });
    exBar.appendChild(b); exBtns.push(b);
  });
  rep.addEventListener('click',()=>{ if(cur!==null) run(cur,curM,false); });
});
</script>
