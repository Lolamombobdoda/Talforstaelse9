<style>

  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; --cR:#FF6B6B; color-scheme:dark}}

<script>
const NS='http://www.w3.org/2000/svg', CANCEL=Symbol('cancel');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CX=360, CW=.62;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=t=>Math.max(0,Math.min(1,t));
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ───────── expression trees ───────── */
const num=(t,key,cls)=>({t:'n',text:String(t),key,cls:cls||''});
const opr=(t,key,cls)=>({t:'o',text:t,key,cls:cls||''});
const cellN=(w,ch)=>({t:'c',w,ch});
const row=(...ch)=>({t:'r',ch:ch.flat(9).filter(Boolean)});
function frc(a,b,key,cls){ cls=cls||''; if(typeof a!=='object') a=num(a,key+'n',cls); if(typeof b!=='object') b=num(b,key+'d',cls); return {t:'f',nu:a,de:b,key,cls}; }
const pw=(b,e)=>({t:'p',b,e});                                 // power: base with a raised exponent
const brc=(c,lab,dir,key,cls)=>({t:'B',c,lab,dir,key,cls:cls||''}); // under- ('u') or overbrace ('o') with a count
const par=(c,key)=>({t:'P',c,key});                            // brackets that grow to fit
const strike=n=>({...n,strike:true});
// the decimal mark (point or comma) is the viewer's choice
let DM=','; try{ DM=localStorage.getItem('wl-decimal-mark')||','; }catch(e){}   // the comma unless the viewer has picked the point
if(DM!=='.'&&DM!==',') DM=',';
const dmk=(key,cls)=>({t:'d',key,cls:cls||''});   // the decimal mark, narrow so the digits stay close
const arr=key=>({t:'A',key});
const rt=(c,key,cls)=>({t:'R',c,key,cls:cls??'cF'});   // a root sign that grows to fit                      // a small arrow
const isV=x=>typeof x==='string'&&/^[a-z]$/.test(x);
const V=(t,key,cls)=>num(t,key,((cls||'')+' it').trim());
const N=(x,key,cls)=>isV(x)?V(x,key,cls):num(x,key,cls);
const X=(e,key,cls)=>typeof e==='object'?e:N(e,key,cls);

const ks=k=>k!=null?k:undefined;
function shift(l,dx,dy){ const q={...l};
  if(q.kind==='p'){ q.x1+=dx; q.x2+=dx; q.y1+=dy; q.y2+=dy; }
  else { if(q.kind==='b'){ q.x1+=dx; q.x2+=dx; } else q.x+=dx; q.y+=dy; }
  return q; }
function lay(node,s){
  if(node.t==='R'){
    const C=lay(node.c,s), lw=.62*s, top=-(Math.max(C.asc,.74*s)+.14*s), bot=Math.max(C.desc,.06*s)+.1*s, x2=lw+C.w+.08*s;
    return {w:x2+.06*s,asc:-top+.06*s,desc:bot,leaves:[...C.leaves.map(l=>shift(l,lw,0)),{key:node.key,kind:'p',shape:'rt',cls:node.cls,x1:.04*s,x2,y1:top,y2:bot,s}]};
  }
  if(node.t==='d'){ const w=.36*s; return {w,asc:.74*s,desc:.16*s,leaves:[{key:node.key,kind:'t',text:DM,cls:node.cls,x:w/2,y:0,s}]}; }
  if(node.t==='A'){ const w=1.1*s, y=-.3*s; return {w,asc:.5*s,desc:0,leaves:[{key:node.key,kind:'p',shape:'ar',cls:'',x1:.15*s,x2:w-.15*s,y1:y,y2:y,s}]}; }
  if(node.t==='o'&&node.text==='/'){   // division: a large slash
    const k=1.55, tw=CW*k*s, pad=.1*s, sh=.2*s;
    return {w:tw+2*pad,asc:.74*k*s-sh,desc:sh+.06*s,leaves:[{key:node.key,kind:'t',text:'/',cls:node.cls,x:pad+tw/2,y:sh,s:k*s}]};
  }
  if(node.t==='n'||node.t==='o'){
    const ell=node.text==='⋯', tw=(ell?1.3:[...node.text].length)*CW*s, pad=node.t==='o'?((node.text==='·'||ell)?.14:.34)*s:0;
    const leaves=[{key:node.key,kind:'t',text:node.text,cls:node.cls,x:pad+tw/2,y:0,s}];
    if(node.strike) leaves.push({key:node.key!=null?node.key+'.x':undefined,kind:'p',shape:'x',cls:'',x1:pad-.14*s,x2:pad+tw+.14*s,y1:.12*s,y2:-.84*s,s});
    return {w:tw+2*pad,asc:.74*s,desc:.06*s,leaves};
  }
  if(node.t==='c'){
    if(!node.ch) return {w:node.w,asc:0,desc:0,leaves:[]};
    const L=lay(node.ch,s); return {w:node.w,asc:L.asc,desc:L.desc,leaves:L.leaves.map(l=>shift(l,(node.w-L.w)/2,0))};
  }
  if(node.t==='r'){
    let x=0,asc=0,desc=0; const leaves=[];
    for(const ch of node.ch){ const L=lay(ch,s); for(const l of L.leaves) leaves.push(shift(l,x,0)); x+=L.w; asc=Math.max(asc,L.asc); desc=Math.max(desc,L.desc); }
    return {w:x,asc,desc,leaves};
  }
  if(node.t==='p'){
    const B=lay(node.b,s), es=.62*s, E=lay(node.e,es), rise=Math.max(.4*s,B.asc-.5*es), gx=.04*s;
    return {w:B.w+gx+E.w+.05*s,asc:Math.max(B.asc,rise+E.asc),desc:Math.max(B.desc,E.desc-rise),
      leaves:[...B.leaves,...E.leaves.map(l=>shift(l,B.w+gx,-rise))]};
  }
  if(node.t==='B'){
    const C=lay(node.c,s), ls=Math.max(.62*s,16), Lb=lay(node.lab,ls), w=Math.max(C.w,Lb.w), cx=(w-C.w)/2, lx=(w-Lb.w)/2;
    const g=.14*s, bh=.3*s, ins=.05*s, leaves=C.leaves.map(l=>shift(l,cx,0)), key=node.key!=null?node.key+'.br':undefined;
    if(node.dir==='u'){
      const y1=C.desc+g, y2=y1+bh, yl=y2+.14*s+Lb.asc;
      leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
      Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
      return {w,asc:C.asc,desc:yl+Lb.desc,leaves};
    }
    const y1=-C.asc-g, y2=y1-bh, yl=y2-.14*s-Lb.desc;
    leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
    Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
    return {w,asc:-yl+Lb.asc,desc:C.desc,leaves};
  }
  if(node.t==='P'){
    const C=lay(node.c,s), pw_=.36*s, asc=Math.max(C.asc,.74*s)+.1*s, desc=Math.max(C.desc,.06*s)+.16*s, kk=node.key;
    const leaves=C.leaves.map(l=>shift(l,pw_,0));
    leaves.push({key:kk!=null?kk+'.pl':undefined,kind:'p',shape:'pl',cls:'',x1:.05*s,x2:pw_-.02*s,y1:-asc,y2:desc,s});
    leaves.push({key:kk!=null?kk+'.pr':undefined,kind:'p',shape:'pr',cls:'',x1:pw_+C.w+.02*s,x2:2*pw_+C.w-.05*s,y1:-asc,y2:desc,s});
    return {w:C.w+2*pw_,asc,desc,leaves};
  }
  const T=lay(node.nu,s), B=lay(node.de,s), pad=.24*s, gap=(node.gap??.2)*s, ax=.3*s, w=Math.max(T.w,B.w)+2*pad;
  const yT=-ax-gap-T.desc, yB=-ax+gap+B.asc, leaves=[];
  for(const l of T.leaves) leaves.push(shift(l,(w-T.w)/2,yT));
  for(const l of B.leaves) leaves.push(shift(l,(w-B.w)/2,yB));
  leaves.push({key:node.key!=null?node.key+'.bar':undefined,kind:'b',cls:node.cls,x1:pad*.4,x2:w-pad*.4,y:-ax,s});
  return {w,asc:-yT+T.asc,desc:yB+B.desc,leaves};
}
function pathD(l){
  const {x1,x2,y1,y2}=l, ym=(y1+y2)/2;
  if(l.shape==='x') return `M${x1} ${y1}L${x2} ${y2}`;
  if(l.shape==='rt'){ const s=l.s; return `M${x1} ${y2-.4*s}L${x1+.13*s} ${y2-.48*s}L${x1+.3*s} ${y2}L${x1+.5*s} ${y1}L${x2} ${y1}`; }
  if(l.shape==='ar'){ const h=.18*l.s; return `M${x1} ${y1}L${x2} ${y1}M${x2-h} ${y1-h}L${x2} ${y1}L${x2-h} ${y1+h}`; }
  if(l.shape==='pl') return `M${x2} ${y1}Q${2*x1-x2} ${ym} ${x2} ${y2}`;
  if(l.shape==='pr') return `M${x1} ${y1}Q${2*x2-x1} ${ym} ${x1} ${y2}`;
  const xm=(x1+x2)/2, q=Math.min(Math.abs(y2-y1)*.9,(x2-x1)/4);
  return `M${x1} ${y1}Q${x1} ${ym} ${x1+q} ${ym}L${xm-q} ${ym}Q${xm} ${ym} ${xm} ${y2}Q${xm} ${ym} ${xm+q} ${ym}L${x2-q} ${ym}Q${x2} ${ym} ${x2} ${y1}`;
}
const klassOf=l=>(l.kind==='t'?'lf ':l.kind==='b'?'lbar ':'lpath ')+l.cls;
function mkLeaf(parent,l){
  const e=el(l.kind==='t'?'text':l.kind==='b'?'line':'path',{class:klassOf(l)},parent);
  if(l.kind==='t'){ e.setAttribute('text-anchor','middle'); e.textContent=l.text; }
  setLeaf(e,l); return e;
}
function setLeaf(e,l){
  if(l.kind==='t'){ e.setAttribute('x',l.x); e.setAttribute('y',l.y); e.setAttribute('font-size',l.s); }
  else if(l.kind==='b'){ e.setAttribute('x1',l.x1); e.setAttribute('x2',l.x2); e.setAttribute('y1',l.y); e.setAttribute('y2',l.y); e.setAttribute('stroke-width',Math.max(1.6,l.s*.07)); }
  else { e.setAttribute('d',pathD(l)); e.setAttribute('stroke-width',Math.max(1.6,l.s*(l.shape==='br'?.06:.075))); }
}
function mixLeaf(a,b,t,dx,dy){
  const q={...b};
  if(b.kind==='t'){ q.x=lerp(a.x,b.x,t)+(dx||0); q.y=lerp(a.y,b.y,t)+(dy||0); q.s=lerp(a.s,b.s,t); }
  else if(b.kind==='b'){ q.x1=lerp(a.x1,b.x1,t)+(dx||0); q.x2=lerp(a.x2,b.x2,t)+(dx||0); q.y=lerp(a.y,b.y,t)+(dy||0); }
  else { q.x1=lerp(a.x1,b.x1,t)+(dx||0); q.x2=lerp(a.x2,b.x2,t)+(dx||0); q.y1=lerp(a.y1,b.y1,t)+(dy||0); q.y2=lerp(a.y2,b.y2,t)+(dy||0); q.s=lerp(a.s,b.s,t); }
  return q;
}
const sameLeaf=(a,b)=>a.kind==='t'?(a.x===b.x&&a.y===b.y&&a.s===b.s):a.kind==='b'?(a.x1===b.x1&&a.x2===b.x2&&a.y===b.y):(a.x1===b.x1&&a.x2===b.x2&&a.y1===b.y1&&a.y2===b.y2);
const mid=l=>l.kind==='t'?[l.x,l.y-.32*l.s]:l.kind==='b'?[(l.x1+l.x2)/2,l.y]:[(l.x1+l.x2)/2,(l.y1+l.y2)/2];

/* products:  a · a · a  or  a · a · ⋯ · a · a  (ids ending in 'e' are the dots ⋯) */
const isE=id=>id.endsWith('e');
const SL=c=>typeof c==='number'?[...Array(c)].map((_,i)=>String(i)):['0','1','e','3','4'];
function prod(P,ids,fac,sep){ const out=[]; ids.forEach((id,i)=>{ if(i) out.push(sep?sep(ids[i-1]):opr('·',P+'m'+ids[i-1])); out.push(isE(id)?opr('⋯',P+id):fac(id)); }); return row(out); }
const W=(node,s)=>lay(node,s).w;
const ph=(node,s)=>cellN(W(node,s));
const cps=(P,ids,src)=>Object.fromEntries(ids.filter(i=>!isE(i)).map(i=>[P+i,src]));
// numerator and denominator padded on the left to one width, so matching factors stand straight above each other at the right
const G=f=>({...f,gap:.42});   // roomier fraction for long rows of factors
function fracL(T,B,key,s){ const a=W(T,s), b=W(B,s); return G(frc(row(a<b?cellN(b-a):null,T),row(b<a?cellN(a-b):null,B),key)); }

/* ───────── stage + animation context ───────── */
class Stage{
  constructor(svg){ this.svg=svg; this.gen=0; this.introDone=false; this.acc=0; this.pausedAt=null; }
  now(){ return (this.pausedAt??performance.now())-this.acc; }
  pause(){ if(this.pausedAt==null) this.pausedAt=performance.now(); }
  resume(){ if(this.pausedAt!=null){ this.acc+=performance.now()-this.pausedAt; this.pausedAt=null; } }
  get paused(){ return this.pausedAt!=null; }
  play(script,keep,focus){
    this.resume(); this.onplay&&this.onplay(!!focus);
    const gen=++this.gen; if(!keep) this.introDone=false; this.instant=false; this.svg.textContent='';
    this.L={}; for(const k of ['marks','eq','fx']) this.L[k]=el('g',{},this.svg);
    return script(new Ctx(this,gen)).catch(e=>{ if(e!==CANCEL) console.error(e); })

      const e=el('path',{d:`M${x1} ${y}L${x2} ${y}`,class:'ul',pathLength:1,'stroke-dasharray':'1 2','stroke-dashoffset':1},S.st.L.marks); ul.push(e);
      await S.tw(900,t=>e.setAttribute('stroke-dashoffset',1-t)); };
    await S.wait(300); await seg(0,E.per-1); await S.wait(400);
    const n=E.x.split('.')[1].length; await seg(E.per,n-1); await S.wait(500); await S.glow('se',1000);
    // so it is a fraction after all
    const t=row(sub,eq_('q='),E.a<0?num('−','qm'):null,frc(num(Math.abs(E.a),'qa'),num(E.b,'qb'),'qf'));
    await S.show('w',t,{fade:900}); await S.wait(400); return [t,true,ul]; }
  if(E.k==='d'){ const [a,b]=E.x.replace('-','').split('.'), digs=(a+b).replace(/^0+/,''), from={qm:'sm'};
    // the digits of the numerator come from the digits of the decimal
    const all=[...a].map((_,j)=>'si'+j).concat([...b].map((_,j)=>'sd'+j)), off=all.length-digs.length;
    const nu=row([...digs].map((c,j)=>{ from['qn'+j]=all[off+j]; return num(c,'qn'+j); }));
    const t=row(sub,eq_('q='),E.x[0]==='-'?num('−','qm'):null,frc(nu,num(10**b.length,'qb'),'qf'));
    await S.show('w',t,{from,dur2:1200}); await S.wait(500); return [t,true]; }
  if(isRat(E)){ const r=Math.sqrt(E.n), t1=row(sub,eq_('q='),num(r,'qv')), t2=row(t1,eq_('q2'),frc(num(r,'qa'),num(1,'qb'),'qf'));
    await S.show('w',t1,{fade:800}); await S.wait(700);
    await S.show('w',t2,{from:{qa:'qv'},dur2:1100}); await S.wait(500); return [t2,true]; }
  // a root or π: the decimals go on and on
  const [a,b]=E.x.split('.'); let t;
  for(let j=0;j<=b.length;j++){ t=row(sub,eq_('q='),dec(j?a+'.'+b.slice(0,j):a,'x')); await S.show('w',t,{fade:j?320:700}); await S.wait(j?90:300); }
  t=row(t,num('…','xe')); await S.show('w',t,{fade:600}); await S.wait(200); await S.glow('xe',1200);
  return [t,false];
}
// the small decimal mark swells more than a digit would while it pulses red
function pulseMark(S,key,dur=2400){
  const c=S.cur.get(key); if(!c) return Promise.resolve(); const cx=c.spec.x, cy=c.spec.y-.06*c.spec.s;   // the mark sits on the baseline
  return S.tw(dur,t=>{ const p=Math.sin(Math.PI*((t*2)%1)), k=1+.9*p;
    c.el.style.fill=t>=1?'':`color-mix(in srgb, var(--cR) ${Math.round(p*100)}%, var(--ink))`;
    c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`); },true);
}
// 2 · written as a decimal, is there a decimal mark?
async function testZ(S,E,sub){
  if(isInt(E)){
    if(E.k==='i'){ await S.wait(300); await S.wiggle(['sm','sa'],1400); return [sub,true]; }
    const t=row(sub,eq_('z='),intT(iv(E),'x'));
    await S.show('w',t,{fade:900}); await S.wait(400); await S.wiggle(['xm','xa'],1400); return [t,true]; }
  if(E.k==='d'){ await S.wait(300); await pulseMark(S,'sp'); return [sub,false]; }
  const t=row(sub,eq_('z='),dec(E.x,'x'),E.e?num('…','xe'):null);
  await S.show('w',t,{fade:900}); await S.wait(500); await pulseMark(S,'xp'); return [t,false];
}
// 3 · is it negative?  4 · is it zero?
async function testSign(S,E,sub,zero){
  const v=iv(E), rel=zero?(v!==0?'≠':'='):(v>=0?'≥':'<'), lit=E.k==='i';
  const t=row(sub,lit?null:eq_('y='),lit?null:intT(v,'y'),opr(rel,'yr'),num(0,'y0'));
  await S.show('w',t,{fade:900}); await S.wait(500);
  const ok=zero?v!==0:v>=0;
  if(!ok) await S.pulseRed(zero?[lit?'sa':'ya','yr']:[lit?'sm':'ym'],2000);
  return [t,ok];
}

async function runNum(S,E){
  const C=classify(E,WM), ord=order(WM), sub=tok(E,'s'), tests=[testQ,testZ,(S,E,s)=>testSign(S,E,s,false),(S,E,s)=>testSign(S,E,s,true)];
  clearHi(); const old=SC.tok.get(E.id); if(old) old.setAttribute('opacity',0);
  S.cfg('w',{cx:WX,y:WY,s:34,al:'l'});
  await S.show('w',sub,{fade:800}); await S.wait(400);
  // it starts in ℝ, in the chain and in the picture
  const rx=k=>GEO.ch[k].x-25, ring=el('rect',{x:rx('R'),y:CHY-37,width:50,height:50,rx:14,class:'ring',opacity:0},S.st.L.marks);
  hiSet('R'); await S.tw(700,t=>ring.setAttribute('opacity',t)); await S.wait(500);
  let at=0;
  for(let k=0;k<C.res.length;k++){
    actTest(k,true); await S.wait(700);
    const [t,ok,ex=[]]=await tests[k](S,E,sub);
    const m=await mark(S,ok,endX(t),WY-12); await S.wait(700);
    actTest(k,false);
    if(!ok){ await S.all(S.tw(700,u=>[m,...ex].forEach(e=>e.setAttribute('opacity',1-u))),S.show('w',sub,{dur:900})); m.remove(); await S.wait(300); break; }
    // through the gate: the ring moves on, and the next set lights up
    const a=rx(ord[at]), b=rx(ord[at+1]); at++; hiSet(ord[at]);
    await S.all(S.tw(1100,u=>ring.setAttribute('x',lerp(a,b,u))), S.tw(700,u=>[m,...ex].forEach(e=>e.setAttribute('opacity',1-u))), k+1<C.res.length?S.show('w',sub,{dur:900}):null);
    m.remove(); ex.forEach(e=>e.remove()); await S.wait(300);
  }
  // the number floats up into its set
  await fly(S,E);
  await S.tw(900,t=>ring.setAttribute('opacity',1-t)); clearHi();
}
async function fly(S,E){
  const A=lay(sub0(E),34), a=A.leaves.map(l=>shift(l,WX,WY)), sl=GEO.slot[E.id], b=tokLeaves(E,'s',TS).map(l=>shift(l,sl.x,sl.y));
  const cl=a.map(l=>mkLeaf(S.st.L.fx,l));
  for(const [k,c] of S.cur) if(c.line==='w'){ c.el.remove(); S.cur.delete(k); }
  S.st.L.marks.querySelectorAll('.mk').forEach(e=>e.remove());
  const h=70;
  await S.tw(1600,t=>cl.forEach((e,i)=>setLeaf(e,mixLeaf(a[i],b[i],t,0,-h*Math.sin(Math.PI*t)))));
  putTok(S.st,E); cl.forEach(e=>e.remove());
}
const sub0=E=>tok(E,'s');

/* ───────── static pictures ───────── */
function svgOf(tree,s,pad=6){
  const L=lay(tree,s), w=L.w+2*pad, h=L.asc+L.desc+2*pad, svg=el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,class:'ic','aria-hidden':'true'});
  L.leaves.forEach(l=>mkLeaf(svg,shift(l,pad,pad+L.asc))); return svg;
}
function say(n){
  if(n.t==='n'||n.t==='o') return n.text;
  if(n.t==='d') return DM;
  if(n.t==='R') return '√('+say(n.c)+')';
  if(n.t==='r') return n.ch.map(say).join('');
  if(n.t==='f') return say(n.nu)+'/'+say(n.de);
  return '';
}
const comma=()=>opr(',',null);
const list=(...xs)=>row(num('{'),xs.flatMap((x,i)=>i?[num(','),cellN(8),x]:[x]),num('}'));
function statics(){
  const ord=order(WM).slice().reverse();
  document.getElementById('ops').replaceChildren(svgOf(row(ord.flatMap((k,i)=>i?[cellN(40),ds(GL[k])]:[ds(GL[k])])),64,2));
  // the legend: which numbers are natural (and whole)
  const N0=row(ds('ℕ'),opr('='),list(num(0),num(1),num(2),num(3),num('…')));
  const N1=row(ds('ℕ'),opr('='),list(num(1),num(2),num(3),num('…')));
  const W0=row(ds('𝕎'),opr('='),list(num(0),num(1),num(2),num(3),num('…')));
  document.getElementById('legend').replaceChildren(svgOf(WM?row(W0,cellN(40),N1):N0,22,2));
  // the decimal mark: point or comma
  const sw=document.getElementById('dmsw'); sw.replaceChildren();
  [',','.'].forEach(c=>{ const bt=document.createElement('button'); bt.type='button'; bt.setAttribute('aria-label','0'+c+'5'); bt.setAttribute('aria-pressed',DM===c);
    bt.className=DM===c?'on':''; const sv=DM; DM=c; bt.appendChild(svgOf(row(num(0),dmk(),num(5)),18)); DM=sv;
    bt.addEventListener('click',()=>setDM(c)); sw.appendChild(bt); });
  // whole numbers on or off: a box with a tick, and 𝕎
  const ws=document.getElementById('wsw'); ws.replaceChildren();
  const bt=document.createElement('button'); bt.type='button'; bt.setAttribute('aria-label','𝕎?'); bt.setAttribute('aria-pressed',WM); bt.className=WM?'on':'';
  const sv=el('svg',{viewBox:'0 0 64 26',width:64,height:26,class:'ic','aria-hidden':'true'});
  el('rect',{x:2,y:4,width:18,height:18,rx:4,fill:'none',stroke:'currentColor','stroke-width':2},sv);
  if(WM) el('path',{d:'M6 13l4 4.5l7 -9',fill:'none',stroke:'currentColor','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'},sv);
  const tx=el('text',{x:37,y:21,'text-anchor':'middle','font-size':22,class:'lf ds'},sv); tx.textContent='𝕎';
  const q=el('text',{x:56,y:20,'text-anchor':'middle','font-size':18,class:'lf'},sv); q.textContent='?';
  bt.appendChild(sv); bt.addEventListener('click',()=>setWM(!WM)); ws.appendChild(bt);
  const gl=document.querySelector('.glyph'); gl.replaceChildren(svgOf(ds('⊂'),44,2));
}

/* ───────── wiring ───────── */
const sec=document.querySelector('[data-sec=ns]'), st=new NStage(sec.querySelector('svg.stage'));
const exBar=sec.querySelector('.exs'), pp=sec.querySelector('.pp'), rs=sec.querySelector('.rs');
let cur=null, releaseT=null, dropT=null, morph=null;
function setFocus(on){
  clearTimeout(releaseT); clearTimeout(dropT);
  if(on) sec.classList.add('active'); else dropT=setTimeout(()=>sec.classList.remove('active'),2100);
  document.body.classList.toggle('focusing',on);
}
const ICO_PAUSE='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="2" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="5" height="16" rx="1.5" fill="currentColor"/></svg>';
const ICO_PLAY='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2.5 L16 10 L3 17.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const ppShow=()=>{ pp.innerHTML=st.paused?ICO_PLAY:ICO_PAUSE; pp.setAttribute('aria-label',st.paused?'▶':'❚❚'); pp.setAttribute('aria-pressed',st.paused); };
pp.addEventListener('click',()=>{ st.paused?st.resume():st.pause(); ppShow(); });
st.onplay=()=>{ setTimeout(ppShow); pp.hidden=false; setFocus(true); };
st.onend=()=>{ cur=null; clearTimeout(releaseT); releaseT=setTimeout(()=>setFocus(false),1300); };
const btns=[];
const markBtns=()=>btns.forEach((b,i)=>{ const on=SC.tok.has(i); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
// a number that is still being tested goes straight to its set
function finish(){
  if(morph) morph.end();
  if(cur){ const E=cur; cur=null; st.stop(); clearHi(); putTok(st,E); SC.tok.get(E.id).setAttribute('opacity',1); markBtns(); }
}
function start(E){
  finish(); cur=E; rs.hidden=false;
  st.play(S=>runNum(S,E).then(()=>{ if(cur===E) cur=null; markBtns(); }));
}
const draw=()=>NUMS.forEach((E,i)=>{ const b=btns[i]; b.setAttribute('aria-label',say(tok(E,null))); b.replaceChildren(svgOf(tok(E,null),17,3)); });
NUMS.forEach((E,i)=>{ const b=document.createElement('button'); b.type='button'; b.id='ex-ns-'+i; b.addEventListener('click',()=>start(E)); btns.push(b); });
BTN.forEach(i=>exBar.appendChild(btns[i]));
// everything back to empty sets
rs.addEventListener('click',()=>{ finish(); st.stop(); for(const e of SC.tok.values()) e.remove(); SC.tok.clear(); clearHi(); markBtns(); rs.hidden=true; pp.hidden=true; setFocus(false); });
// a new decimal mark: numbers with decimals are redrawn where they are
function setDM(c){
  if(c===DM) return; finish(); DM=c; try{ localStorage.setItem('wl-decimal-mark',c); }catch(e){}
  statics(); draw(); drawIcons(); for(const id of [...SC.tok.keys()]) putTok(st,NUMS[id]); setFocus(false);
}
// whole numbers on or off: the ovals and the numbers glide to their new places
function setWM(on){
  finish(); setFocus(false); WM=on; try{ localStorage.setItem('wl-whole',on?'1':'0'); }catch(e){}
  statics(); const A=GEO, B=geo(on); GEO=B;
  if(RM){ applyG(B); return; }
  const t0=performance.now(), dur=1400; let done=false;
  morph={end(){ done=true; applyG(B); morph=null; }};
  const step=()=>{ if(done) return; const t=Math.min(1,(performance.now()-t0)/dur); applyG(mixG(A,B,ease(t))); t<1?requestAnimationFrame(step):morph&&morph.end(); };
  requestAnimationFrame(step);
}
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||!cur||e.target.closest('button,input,textarea')) return;
  e.preventDefault(); st.paused?st.resume():st.pause(); ppShow();
});
statics(); buildScene(st); draw(); markBtns();
</script>
