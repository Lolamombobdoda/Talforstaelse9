<title>Square Roots in Motion</title>

<style>
/* Layout: one stage per idea. Expression on top, the working below it. Orange = a side (and the first number), blue = the second number, green = the action (the exponent 2, the root sign, the tens, the half), purple = an area, red = conditions such as x ≥ 0. */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#172031; --mute:#7D879A; --rule:#D3D9E2; --dim:rgba(16,22,34,.16);
  --cA:#DD5F0B; --cB:#2357D4; --cF:#0E8A5A; --cO:#7A3FD8; --cR:#D42A2A;
  --area:color-mix(in srgb, var(--cO) 15%, var(--panel));
  --font:'Azeret Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; --cR:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; --cR:#FF6B6B; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font)}
.wrap{max-width:936px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:36px 72px;display:flex;flex-direction:column;gap:44px}

svg.stage{display:block;width:100%;height:auto}
.bar,.methods{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--rule);align-items:center}

button:focus-visible{outline:3px solid var(--cB);outline-offset:2px}

svg text{font-family:var(--font);font-weight:600}
.lf{fill:var(--ink);transition:fill .6s}

.lbar{stroke:var(--ink);stroke-linecap:round;transition:stroke .6s}

.lf.cA{fill:var(--cA)} .lf.cB{fill:var(--cB)} .lf.cF{fill:var(--cF)} .lf.cO{fill:var(--cO)} .lf.cR{fill:var(--cR)} .lf.mut{fill:var(--mute)}
.lbar.cA,.lpath.cA{stroke:var(--cA)} .lbar.cB,.lpath.cB{stroke:var(--cB)} .lbar.cF,.lpath.cF{stroke:var(--cF)} .lbar.cO,.lpath.cO{stroke:var(--cO)}
.lf.dim{fill:var(--rule)} .lbar.dim,.lpath.dim{stroke:var(--rule)}
.cell{fill:var(--area);stroke:var(--cO);stroke-width:1.2}
.area{fill:var(--area);stroke:var(--cO);stroke-width:2;transition:opacity .9s}
.area.dim{opacity:.3}

.nlax{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.nltk{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.band{fill:var(--cA);fill-opacity:.25;stroke:var(--cA);stroke-width:1.5}
.tint{fill:var(--cA);fill-opacity:.38}
.lf.halo{paint-order:stroke;stroke:var(--area);stroke-width:6px;stroke-linejoin:round}
.hsw{display:inline-flex;gap:6px;padding-right:12px;margin-right:4px;border-right:1px solid var(--rule)}
.ic{display:block}
@media (prefers-reduced-motion: reduce){.lf,.lbar,.lpath{transition:none}}
.note{position:relative;transition:opacity 2s;max-width:62ch;margin:0 auto;text-align:center;font-size:13px;line-height:1.6;color:var(--mute)}
.note p{margin:0}
body.focusing .note{opacity:.4}

<script>
const NS='http://www.w3.org/2000/svg', CANCEL=Symbol('cancel');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CX=360, CW=.62;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=t=>Math.max(0,Math.min(1,t));
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ───────── expression trees ───────── */
const num=(t,key,cls)=>({t:'n',text:String(t),key,cls:cls||''});
const opr=(t,key,cls)=>({t:'o',text:t,key,cls:cls||''});
const cellN=(w,ch)=>({t:'c',w,ch});
const row=(...ch)=>({t:'r',ch:ch.flat(9).filter(Boolean)});
function frc(a,b,key,cls){ cls=cls||''; if(typeof a!=='object') a=num(a,key+'n',cls); if(typeof b!=='object') b=num(b,key+'d',cls); return {t:'f',nu:a,de:b,key,cls}; }
const pw=(b,e)=>({t:'p',b,e});                                 // power: base with a raised exponent
const brc=(c,lab,dir,key,cls)=>({t:'B',c,lab,dir,key,cls:cls||''}); // under- ('u') or overbrace ('o') with a count
const par=(c,key)=>({t:'P',c,key});                            // brackets that grow to fit
const strike=n=>({...n,strike:true});
// the decimal mark (point or comma) is the viewer's choice
let DM=','; try{ DM=localStorage.getItem('wl-decimal-mark')||','; }catch(e){}   // the comma unless the viewer has picked the point
if(DM!=='.'&&DM!==',') DM=',';
const dmk=(key,cls)=>({t:'d',key,cls:cls||''});   // the decimal mark, narrow so the digits stay close
const arr=key=>({t:'A',key});
const rt=(c,key,cls)=>({t:'R',c,key,cls:cls??'cF'});   // a root sign that grows to fit                      // a small arrow
const isV=x=>typeof x==='string'&&/^[a-z]$/.test(x);
const V=(t,key,cls)=>num(t,key,((cls||'')+' it').trim());
const N=(x,key,cls)=>isV(x)?V(x,key,cls):num(x,key,cls);
const X=(e,key,cls)=>typeof e==='object'?e:N(e,key,cls);

const ks=k=>k!=null?k:undefined;
function shift(l,dx,dy){ const q={...l};
  if(q.kind==='p'){ q.x1+=dx; q.x2+=dx; q.y1+=dy; q.y2+=dy; }
  else { if(q.kind==='b'){ q.x1+=dx; q.x2+=dx; } else q.x+=dx; q.y+=dy; }
  return q; }
function lay(node,s){
  if(node.t==='R'){
    const C=lay(node.c,s), lw=.62*s, top=-(Math.max(C.asc,.74*s)+.14*s), bot=Math.max(C.desc,.06*s)+.1*s, x2=lw+C.w+.08*s;
    return {w:x2+.06*s,asc:-top+.06*s,desc:bot,leaves:[...C.leaves.map(l=>shift(l,lw,0)),{key:node.key,kind:'p',shape:'rt',cls:node.cls,x1:.04*s,x2,y1:top,y2:bot,s}]};
  }
  if(node.t==='d'){ const w=.36*s; return {w,asc:.74*s,desc:.16*s,leaves:[{key:node.key,kind:'t',text:DM,cls:node.cls,x:w/2,y:0,s}]}; }
  if(node.t==='A'){ const w=1.1*s, y=-.3*s; return {w,asc:.5*s,desc:0,leaves:[{key:node.key,kind:'p',shape:'ar',cls:'',x1:.15*s,x2:w-.15*s,y1:y,y2:y,s}]}; }
  if(node.t==='o'&&node.text==='/'){   // division: a large slash
    const k=1.55, tw=CW*k*s, pad=.1*s, sh=.2*s;
    return {w:tw+2*pad,asc:.74*k*s-sh,desc:sh+.06*s,leaves:[{key:node.key,kind:'t',text:'/',cls:node.cls,x:pad+tw/2,y:sh,s:k*s}]};
  }
  if(node.t==='n'||node.t==='o'){
    const ell=node.text==='⋯', tw=(ell?1.3:[...node.text].length)*CW*s, pad=node.t==='o'?((node.text==='·'||ell)?.14:.34)*s:0;
    const leaves=[{key:node.key,kind:'t',text:node.text,cls:node.cls,x:pad+tw/2,y:0,s}];
    if(node.strike) leaves.push({key:node.key!=null?node.key+'.x':undefined,kind:'p',shape:'x',cls:'',x1:pad-.14*s,x2:pad+tw+.14*s,y1:.12*s,y2:-.84*s,s});
    return {w:tw+2*pad,asc:.74*s,desc:.06*s,leaves};
  }
  if(node.t==='c'){
    if(!node.ch) return {w:node.w,asc:0,desc:0,leaves:[]};
    const L=lay(node.ch,s); return {w:node.w,asc:L.asc,desc:L.desc,leaves:L.leaves.map(l=>shift(l,(node.w-L.w)/2,0))};
  }
  if(node.t==='r'){
    let x=0,asc=0,desc=0; const leaves=[];
    for(const ch of node.ch){ const L=lay(ch,s); for(const l of L.leaves) leaves.push(shift(l,x,0)); x+=L.w; asc=Math.max(asc,L.asc); desc=Math.max(desc,L.desc); }
    return {w:x,asc,desc,leaves};
  }
  if(node.t==='p'){
    const B=lay(node.b,s), es=.62*s, E=lay(node.e,es), rise=Math.max(.4*s,B.asc-.5*es), gx=.04*s;
    return {w:B.w+gx+E.w+.05*s,asc:Math.max(B.asc,rise+E.asc),desc:Math.max(B.desc,E.desc-rise),
      leaves:[...B.leaves,...E.leaves.map(l=>shift(l,B.w+gx,-rise))]};
  }
  if(node.t==='B'){
    const C=lay(node.c,s), ls=Math.max(.62*s,16), Lb=lay(node.lab,ls), w=Math.max(C.w,Lb.w), cx=(w-C.w)/2, lx=(w-Lb.w)/2;
    const g=.14*s, bh=.3*s, ins=.05*s, leaves=C.leaves.map(l=>shift(l,cx,0)), key=node.key!=null?node.key+'.br':undefined;
    if(node.dir==='u'){
      const y1=C.desc+g, y2=y1+bh, yl=y2+.14*s+Lb.asc;
      leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
      Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
      return {w,asc:C.asc,desc:yl+Lb.desc,leaves};
    }
    const y1=-C.asc-g, y2=y1-bh, yl=y2-.14*s-Lb.desc;
    leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
    Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
    return {w,asc:-yl+Lb.asc,desc:C.desc,leaves};
  }
  if(node.t==='P'){
    const C=lay(node.c,s), pw_=.36*s, asc=Math.max(C.asc,.74*s)+.1*s, desc=Math.max(C.desc,.06*s)+.16*s, kk=node.key;
    const leaves=C.leaves.map(l=>shift(l,pw_,0));
    leaves.push({key:kk!=null?kk+'.pl':undefined,kind:'p',shape:'pl',cls:'',x1:.05*s,x2:pw_-.02*s,y1:-asc,y2:desc,s});
    leaves.push({key:kk!=null?kk+'.pr':undefined,kind:'p',shape:'pr',cls:'',x1:pw_+C.w+.02*s,x2:2*pw_+C.w-.05*s,y1:-asc,y2:desc,s});
    return {w:C.w+2*pw_,asc,desc,leaves};
  }
  const T=lay(node.nu,s), B=lay(node.de,s), pad=.24*s, gap=(node.gap??.2)*s, ax=.3*s, w=Math.max(T.w,B.w)+2*pad;
  const yT=-ax-gap-T.desc, yB=-ax+gap+B.asc, leaves=[];
  for(const l of T.leaves) leaves.push(shift(l,(w-T.w)/2,yT));
  for(const l of B.leaves) leaves.push(shift(l,(w-B.w)/2,yB));
  leaves.push({key:node.key!=null?node.key+'.bar':undefined,kind:'b',cls:node.cls,x1:pad*.4,x2:w-pad*.4,y:-ax,s});
  return {w,asc:-yT+T.asc,desc:yB+B.desc,leaves};
}
function pathD(l){
  const {x1,x2,y1,y2}=l, ym=(y1+y2)/2;
  if(l.shape==='x') return `M${x1} ${y1}L${x2} ${y2}`;
  if(l.shape==='rt'){ const s=l.s; return `M${x1} ${y2-.4*s}L${x1+.13*s} ${y2-.48*s}L${x1+.3*s} ${y2}L${x1+.5*s} ${y1}L${x2} ${y1}`; }
  if(l.shape==='ar'){ const h=.18*l.s; return `M${x1} ${y1}L${x2} ${y1}M${x2-h} ${y1-h}L${x2} ${y1}L${x2-h} ${y1+h}`; }
  if(l.shape==='pl') return `M${x2} ${y1}Q${2*x1-x2} ${ym} ${x2} ${y2}`;
  if(l.shape==='pr') return `M${x1} ${y1}Q${2*x2-x1} ${ym} ${x1} ${y2}`;
  const xm=(x1+x2)/2, q=Math.min(Math.abs(y2-y1)*.9,(x2-x1)/4);
  return `M${x1} ${y1}Q${x1} ${ym} ${x1+q} ${ym}L${xm-q} ${ym}Q${xm} ${ym} ${xm} ${y2}Q${xm} ${ym} ${xm+q} ${ym}L${x2-q} ${ym}Q${x2} ${ym} ${x2} ${y1}`;
}
const klassOf=l=>(l.kind==='t'?'lf ':l.kind==='b'?'lbar ':'lpath ')+l.cls;
function mkLeaf(parent,l){
  const e=el(l.kind==='t'?'text':l.kind==='b'?'line':'path',{class:klassOf(l)},parent);
  if(l.kind==='t'){ e.setAttribute('text-anchor','middle'); e.textContent=l.text; }
  setLeaf(e,l); return e;
}
function setLeaf(e,l){
  if(l.kind==='t'){ e.setAttribute('x',l.x); e.setAttribute('y',l.y); e.setAttribute('font-size',l.s); }
  else if(l.kind==='b'){ e.setAttribute('x1',l.x1); e.setAttribute('x2',l.x2); e.setAttribute('y1',l.y); e.setAttribute('y2',l.y); e.setAttribute('stroke-width',Math.max(1.6,l.s*.07)); }
  else { e.setAttribute('d',pathD(l)); e.setAttribute('stroke-width',Math.max(1.6,l.s*(l.shape==='br'?.06:.075))); }
}
function mixLeaf(a,b,t,dx,dy){
  const q={...b};
  if(b.kind==='t'){ q.x=lerp(a.x,b.x,t)+(dx||0); q.y=lerp(a.y,b.y,t)+(dy||0); q.s=lerp(a.s,b.s,t); }
  else if(b.kind==='b'){ q.x1=lerp(a.x1,b.x1,t)+(dx||0); q.x2=lerp(a.x2,b.x2,t)+(dx||0); q.y=lerp(a.y,b.y,t)+(dy||0); }
  else { q.x1=lerp(a.x1,b.x1,t)+(dx||0); q.x2=lerp(a.x2,b.x2,t)+(dx||0); q.y1=lerp(a.y1,b.y1,t)+(dy||0); q.y2=lerp(a.y2,b.y2,t)+(dy||0); q.s=lerp(a.s,b.s,t); }
  return q;
}

/* ───────── stage + animation context ───────── */
class Stage{
  constructor(svg){ this.svg=svg; this.gen=0; this.introDone=false; this.acc=0; this.pausedAt=null; }
  now(){ return (this.pausedAt??performance.now())-this.acc; }
  pause(){ if(this.pausedAt==null) this.pausedAt=performance.now(); }
  resume(){ if(this.pausedAt!=null){ this.acc+=performance.now()-this.pausedAt; this.pausedAt=null; } }
  get paused(){ return this.pausedAt!=null; }
  play(script,keep,focus){
    this.resume(); this.onplay&&this.onplay(!!focus);
    const gen=++this.gen; if(!keep) this.introDone=false; this.instant=false; this.svg.textContent='';
    this.L={}; for(const k of ['marks','eq','fx']) this.L[k]=el('g',{},this.svg);
    return script(new Ctx(this,gen)).catch(e=>{ if(e!==CANCEL) console.error(e); })
      .finally(()=>{ if(this.gen===gen&&focus&&this.onend) this.onend(); });
  }
}
class Ctx{
  constructor(st,gen){ this.st=st; this.gen=gen; this.cur=new Map(); this.lines={}; }
  /* everything runs on the stage clock, which stands still while paused */
  run(d,fn,raw){
    const st=this.st, gen=this.gen;
    return new Promise((res,rej)=>{
      if(st.gen!==gen) return rej(CANCEL);
      if(d<=0){ fn&&fn(1); return res(); }
      const t0=st.now();
      const step=()=>{ if(st.gen!==gen) return rej(CANCEL); const t=Math.min(1,(st.now()-t0)/d); fn&&fn(raw?t:ease(t)); t<1?requestAnimationFrame(step):res(); };
      requestAnimationFrame(step);
    });
  }
  tw(dur,fn,raw){ return this.run((this.st.instant||RM)?0:dur,fn,raw); }
  wait(ms){ return this.run(this.st.instant?0:ms,null); }
  /* swell up, give a small playful wiggle, then settle back */
  wiggle(keys,dur=1400){
    const items=keys.map(k=>this.cur.get(k)).filter(Boolean); if(!items.length) return Promise.resolve();
    const ps=items.map(c=>mid(c.spec)), xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]);
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    return this.tw(dur,t=>{
      const k=1+.09*Math.sin(Math.PI*t), a=4*Math.sin(4*Math.PI*t)*Math.sin(Math.PI*t);
      items.forEach(c=>c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) rotate(${a}) scale(${k}) translate(${-cx} ${-cy})`));
    });
  }
  /* grow briefly and glow a little, then settle back */
  glow(key,dur=1000){
    const c=this.cur.get(key); if(!c) return Promise.resolve(); const [cx,cy]=mid(c.spec);
    return this.tw(dur,t=>{ const p=Math.sin(Math.PI*t), k=1+.6*p;
      c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`);
      c.el.style.filter=t>=1?'':`drop-shadow(0 0 ${6*p}px var(--cF))`; });
  }
  all(...ps){ return Promise.all(ps); }
  /* a small green 10 jumps in an arc from one place to another */
  flyTen(from,to,s,dur=1300){
    const e=mkLeaf(this.st.L.fx,{kind:'t',text:'10',cls:'cF',x:from[0],y:from[1],s:.5*s}), h=Math.max(.9*s,Math.abs(to[0]-from[0])*.3);
    e.setAttribute('opacity',0);
    return this.tw(dur,t=>{ const x=lerp(from[0],to[0],t), y=lerp(from[1],to[1],t)-h*Math.sin(Math.PI*t);
      e.setAttribute('x',x); e.setAttribute('y',y+.16*s); e.setAttribute('opacity',Math.min(clamp(t/.2),1-clamp((t-.75)/.25)));
      if(t>=1) e.remove(); });
  }
  /* a part that breaks a rule pulses gently between ink and red, then settles back */
  pulseRed(keys,dur=2600){
    const cs=keys.map(k=>this.cur.get(k)).filter(Boolean); if(!cs.length) return Promise.resolve();
    const ps=cs.map(c=>mid(c.spec)), xs=ps.map(p=>p[0]), cx=(Math.min(...xs)+Math.max(...xs))/2, cy=ps[0][1];
    return this.tw(dur,t=>{ const p=Math.sin(Math.PI*((t*2)%1)), k=1+.12*p;
      cs.forEach(c=>{ c.el.style.fill=t>=1?'':`color-mix(in srgb, var(--cR) ${Math.round(p*100)}%, var(--ink))`;
        c.el.setAttribute('transform',t>=1?'':`translate(${cx} ${cy}) scale(${k}) translate(${-cx} ${-cy})`); }); },true);
  }
  dimK(keys,on){ keys.forEach(k=>{ const c=this.cur.get(k); if(c) c.el.classList.toggle('dim',on); }); }
  cfg(line,c){ this.lines[line]=c; }

  async begin(tree,c){
    const def={cx:CX,y:92,s:34}, intro=this.st.introDone; this.st.introDone=false;
    if(intro){
      this.cfg('main',def); const sv=this.st.instant; this.st.instant=true; await this.show('main',tree); this.st.instant=sv;
      if(c){ this.cfg('main',c); await this.show('main',tree,{dur:1200}); }
      await this.wait(500);
    } else { this.cfg('main',c||def); await this.show('main',tree); await this.wait(900); }
  }

  /* morph one line of math into a new tree: shared keys glide, changed numbers crossfade, copies grow out of their originals, new parts fade in last */
  async show(line,tree,op={}){
    const cfg=this.lines[line]||(this.lines[line]={cx:CX,y:92,s:34});
    const Lt=lay(tree,cfg.s), x0=cfg.al==='l'?cfg.cx:cfg.cx-Lt.w/2;   // al:'l' keeps the left edge still
    const next=new Map(); for(const l of Lt.leaves) if(l.key!=null) next.set(l.key,shift(l,x0,cfg.y));
    const P=this.st.L.eq, A=[], C=[], fins=[], drop=[], copies=[];
    const cv=k=>{ const v=op.curve&&op.curve[k]; return typeof v==='number'?[v,0]:v?[v.x||0,v.y||0]:[0,0]; };
    const klass=(spec,dim)=>klassOf(spec)+(dim?' dim':'');
    for(const [k,spec] of next){
      const c=this.cur.get(k);
      if(c){
        const from=c.spec, dim=c.el.classList.contains('dim'), [rx,ry]=cv(k);
        if(spec.kind==='t'&&spec.text!==from.text){
          const oe=c.el, ne=mkLeaf(P,{...from,text:spec.text}); ne.setAttribute('class',klass(spec,dim)); ne.setAttribute('opacity',0);
          A.push(t=>{ const m=mixLeaf(from,spec,t,rx*Math.sin(Math.PI*t),ry*Math.sin(Math.PI*t)); setLeaf(oe,m); setLeaf(ne,m); oe.setAttribute('opacity',1-t); ne.setAttribute('opacity',t); });

        } else {

        }

      }

    const gone=[], goneSpec=new Map();

    // 1: the originals settle into their new places
    // sync: new parts fade in while the others move, instead of after
    if(A.length||gone.length) await this.tw(op.dur??1000,t=>{ A.forEach(fn=>fn(t)); gone.forEach(([e,o])=>e.setAttribute('opacity',o*(1-t))); if(op.sync) fins.forEach(({e})=>e.setAttribute('opacity',t)); });
    if(op.sync&&(A.length||gone.length)) fins.length=0;

      const src=(this.cur.get(sk)||{}).spec||goneSpec.get(sk);

      const start=spec.kind==='t'?{...spec,x:src.x,y:src.y,s:src.s}:spec.kind==='b'?{...spec,x1:src.x1,x2:src.x2,y:src.y}:{...spec,x1:src.x1,x2:src.x2,y1:src.y1,y2:src.y2};
      const e=mkLeaf(P,start), [rx,ry]=cv(k); e.setAttribute('opacity',0);
      C.push(t=>{ setLeaf(e,mixLeaf(start,spec,t,rx*Math.sin(Math.PI*t),ry*Math.sin(Math.PI*t))); e.setAttribute('opacity',Math.min(1,t*1.5)); });

    }
    const side=op.during?op.during():null;
    if(C.length) await this.tw(op.dur2??op.dur??1100,t=>C.forEach(fn=>fn(t)));
    // 3: brand-new parts fade in; a brace grows out from its middle, a strike is drawn
    fins.forEach(({e,spec})=>{ if(spec.shape==='x'||spec.shape==='rt'){ e.setAttribute('pathLength',1); e.setAttribute('stroke-dasharray','1 2'); e.setAttribute('stroke-dashoffset',1); } });
    if(fins.length) await this.tw(op.fade??850,t=>fins.forEach(({e,spec})=>{

      else if(spec.shape==='br'){ const xm=(spec.x1+spec.x2)/2; setLeaf(e,{...spec,x1:lerp(xm,spec.x1,t),x2:lerp(xm,spec.x2,t)}); e.setAttribute('opacity',Math.min(1,t*2)); }
      else e.setAttribute('opacity',t); }));

  }
  focus(keys){ const set=keys?new Set(keys):null; for(const [k,c] of this.cur) c.el.classList.toggle('dim',!!set&&!set.has(k)); }
  async floatGroup(keys,to,op={}){
    const items=keys.map(k=>this.cur.get(k)).filter(Boolean); if(!items.length) return;

}

/* ───────── squares on the stage ───────── */

function seg(S,x1,y1,x2,y2,cls){ return el('line',{x1,y1,x2,y2,class:cls,opacity:0},S.st.L.marks); }
// a shape grows out of its own middle

const opac=(S,els,a,b,dur=800)=>S.tw(dur,t=>els.forEach(e=>e.setAttribute('opacity',lerp(a,b,t))));
/* a condition such as x ≥ 0: it pulses between ink and red, and stays red */

const geq=(v,k,op='≥')=>row(V(v,'n'+k+'v'),opr(op,'n'+k+'o'),num(0,'n'+k+'0'));

/* ───────── 1 · a square of n by n cells, and back from its area to its side ───────── */
const startSq=E=>pw(num(E.n,'b','cA'),num(2,'e','cF'));

/* ───────── 2 · roots between the perfect squares ───────── */
// a decimal written digit by digit, so changed digits crossfade and the mark stays narrow
function dn(str,P,cls){ const it=[]; let j=0; for(const ch of String(str)){ if(ch==='.') it.push(dmk(P+'p',cls)); else it.push(num(ch,P+(j++),cls)); } return row(it); }
const dnFrom=(P,Q,str)=>{ const m={[P+'p']:Q+'p'}; let j=0; for(const ch of String(str)) if(ch!=='.'){ m[P+j]=Q+j; j++; } return m; };
// the square of a decimal, exactly: 3.1 → 9.61
function sqS(str){ const [i,f='']=String(str).split('.'), d=2*f.length, m=(BigInt(i+f)**2n).toString().padStart(d+1,'0'); return d?m.slice(0,-d)+'.'+m.slice(-d):m; }
// the root of N rounded down to k decimals, the next value up, and the first in hundredths
function bounds(N,k){ const X=BigInt(N)*10n**BigInt(2*k); let m=BigInt(Math.floor(Math.sqrt(Number(X))));
  while((m+1n)**2n<=X) m++; while(m*m>X) m--;
  const f=v=>{ const t=v.toString().padStart(k+1,'0'); return k?t.slice(0,-k)+'.'+t.slice(-k):t; };
  return [f(m),f(m+1n),Number(m)*10**(2-k)]; }
/* the number line: the band between the two bounds is squeezed from both sides */
const NL={x0:120,x1:600,y:414};
function numLine(S,lo,hi){
  const g=el('g',{},S.st.L.marks), st={vlo:lo,vhi:hi,tk:[[100,1],[10,1],[1,0],[.1,0]],blo:lo,bhi:hi,band:0,ax:0,labs:[]};
  const X=v=>NL.x0+(v-st.vlo)/(st.vhi-st.vlo)*(NL.x1-NL.x0);
  st.draw=()=>{ g.textContent='';
    el('line',{x1:NL.x0-40,x2:NL.x1+40,y1:NL.y,y2:NL.y,class:'nlax',opacity:st.ax},g);
    el('rect',{x:X(st.blo),y:NL.y-12,width:Math.max(0,X(st.bhi)-X(st.blo)),height:24,rx:3,class:'band',opacity:st.band},g);
    st.tk.forEach(([stp,o])=>{ const px=stp/(st.vhi-st.vlo)*(NL.x1-NL.x0); if(o<=0||px<4) return; const h=px>=300?13:px>=30?8:5;
      for(let i=Math.ceil(st.vlo/stp-1e-6); i*stp<=st.vhi+1e-6; i++) el('line',{x1:X(i*stp),x2:X(i*stp),y1:NL.y-h,y2:NL.y+h,class:'nltk',opacity:o*st.ax},g); });
    st.labs.forEach(l=>{ if(l.o<=0) return; const e=mkLeaf(g,{kind:'t',text:l.t.replace('.',DM),cls:'cA',x:X(l.v)+(l.a==='end'?6:-6),y:NL.y+40,s:20});
      e.setAttribute('text-anchor',l.a); e.setAttribute('opacity',l.o); });
  };

}
const startBet=E=>rt(num(E.N,'n'),'r');
const dKeys=(P,str)=>{ const ks=[P+'p']; let j=0; for(const ch of String(str)) if(ch!=='.') ks.push(P+(j++)); return ks; };
async function runBet(S,E){
  const N=E.N, r=Math.floor(Math.sqrt(N)), s=26, P0=startBet(E), B=[...Array(E.d+1)].map((_,k)=>bounds(N,k));
  const last=B[E.d][0], fin=row(P0,opr('=','mq'),dn(last,'m','cA'),num('…','me'));
  const cx0=E.d?480:CX;          // with trials, the working stands to the right of them
  await S.begin(P0,{cx:CX-W(E.d?fin:P0,34)/2,y:58,s:34,al:'l'});
  // between two perfect squares
  S.cfg('A',{cx:cx0,y:150,s});
  await S.show('A',row(num(r*r,'a1','cO'),opr('<','al'),num(N,'a2'),opr('<','ar'),num((r+1)**2,'a3','cO')),{from:{a2:'n'},dur2:1300}); await S.wait(1100);
  // so the root is between their roots; the root in the middle stays put
  const wl=W(dn(last,'x'),s), pad=node=>cellN(Math.max(0,wl-W(node,s)));
  const RB=(lo,hi)=>row(pad(dn(lo,'x')),dn(lo,'lo','cA'),opr('<','bl'),rt(num(N,'b2'),'br2'),opr('<','bm'),dn(hi,'hi','cA'));
  const L0=rt(num(r*r,'b1','cO'),'br1');
  S.cfg('B',{cx:cx0-W(RB(last,B[E.d][1]),s)/2,y:232,s,al:'l'});
  await S.show('B',row(pad(L0),L0,opr('<','bl'),rt(num(N,'b2'),'br2'),opr('<','bm'),rt(num((r+1)**2,'b3','cO'),'br3')),{from:{b1:'a1',b2:'a2',b3:'a3'},dur2:1300}); await S.wait(1100);
  await S.show('B',RB(String(r),String(r+1)),{dur:1300,sync:true}); await S.wait(800);
  // the number line between them
  const nl=numLine(S,r*100,(r+1)*100); let labLo={v:r*100,t:String(r),o:0,a:'end'}, labHi={v:(r+1)*100,t:String(r+1),o:0,a:'start'}; nl.labs.push(labLo,labHi);
  await S.tw(1000,t=>{ nl.ax=t; labLo.o=labHi.o=t; nl.draw(); });
  await S.tw(800,t=>{ nl.band=t; nl.draw(); }); await S.wait(800);
  if(!E.d) return S.wiggle(['b2','br2'],2200);
  // one edge of the band moves in, and its label changes with it
  const edge=async(lower,str,v,dur=900)=>{
    const old=lower?labLo:labHi, nw={v:old.v,t:str,o:0,a:old.a}, v0=lower?nl.blo:nl.bhi; nl.labs.push(nw);
    await S.tw(dur,t=>{ const x=lerp(v0,v,t); if(lower) nl.blo=x; else nl.bhi=x; old.v=nw.v=x; old.o=1-t; nw.o=t; nl.draw(); });
    nl.labs.splice(nl.labs.indexOf(old),1); if(lower) labLo=nw; else labHi=nw;
  };
  let used=0;
  for(let k=1;k<=E.d;k++){
    if(k>1){ // zoom in on the band, finer ticks appear, and the earlier tries step aside
      const a0=nl.vlo, b0=nl.vhi, a1=nl.blo, b1=nl.bhi;
      await S.all(S.tw(1500,t=>{ nl.vlo=lerp(a0,a1,t); nl.vhi=lerp(b0,b1,t); nl.tk[k][1]=t; nl.draw(); }),
                  ...[...Array(used)].map((_,j)=>S.show('T'+j,row(),{dur:900}))); await S.wait(600);
    }
    // try one value after another, each a step bigger, until its square is too big
    const fK=m=>{ const t=m.toString().padStart(k+1,'0'); return t.slice(0,-k)+'.'+t.slice(-k); };
    const m0=BigInt(B[k-1][0].replace('.',''))*10n, X=BigInt(N)*10n**BigInt(2*k), Q='p'+k;
    let below={v:fK(m0),q:sqS(fK(m0)),K:null}, j=0;
    for(let m=m0+1n;;m++,j++){
      const v=fK(m), q=sqS(v), K='t'+k+'_'+j, hv=Number(m)*10**(2-k);
      S.cfg('T'+j,{cx:40,y:110+30*j,s:20,al:'l'});
      await S.show('T'+j,row(pw(dn(v,K+'v','cA'),num(2,K+'e','cF')),opr('=',K+'q'),dn(q,K+'s','cO')),{fade:650}); await S.wait(300);
      if(m*m<=X){ await edge(true,v,hv); below={v,q,K}; await S.wait(300); continue; }
      // too big: it pulses red, and closes the band from above
      await S.pulseRed(dKeys(K+'s',q),1800);
      await edge(false,v,hv); await S.wait(600);
      // the two squares that hold N between them, then the two bounds
      const from={...dnFrom(Q+'n',K+'s',q),[Q+'N']:'n'}; if(below.K) Object.assign(from,dnFrom(Q+'m',below.K+'s',below.q));
      await S.show('A',row(dn(below.q,Q+'m','cO'),opr('<',Q+'c1'),num(N,Q+'N'),opr('<',Q+'c2'),dn(q,Q+'n','cO')),{from,dur2:1300}); await S.wait(900);
      await S.show('B',RB(below.v,v),{dur:1300}); await S.wait(1000);
      break;
    }
    used=j+1;
  }
  // the digits found so far, and more that never end
  await S.show('main',fin,{from:dnFrom('m','lo',last),dur2:1300}); await S.wait(300);
  await S.glow('me');
}

const half=(k,cls='cF')=>HF==='f'?frc(num(1,k+'n',cls),num(2,k+'d',cls),k,cls):row(num(0,k+'0',cls),dmk(k+'p',cls),num(5,k+'5',cls));

async function runHalf(S,E){

  await S.show('w',L2,{from:{za:'xa',...halfFrom('z1','xe'),...halfFrom('z2','ye')},dur2:1300}); await S.wait(1000);
  const L3=row(L2,opr('=','q2'),pw(hB(E,'ua'),num(1,'ue','cF')));
  await S.show('w',L3,{from:{ua:'za'},dur2:1100}); await S.wait(900);
  await S.show('w',row(L3,opr('=','q3'),hB(E,'v')),{from:{v:'ua'},dur2:1100}); await S.wait(1000);
  // the root times itself gives the same
  const K=row(rt(hB(E,'ka'),'kr1'),opr('·','km'),rt(hB(E,'kb'),'kr2'));
  S.cfg('k',{cx:LX-W(K,30),y:L6[2],s:30,al:'l'});
  await S.show('k',row(K,opr('=','kq'),hB(E,'kv')),{from:{ka:'a',kb:'a'},dur2:1300}); await S.wait(800);
  await S.all(S.wiggle(['v'],2000),S.wiggle(['kv'],2000)); await S.wait(500);
  // so the half power is the root
  await S.show('main',row(P,opr('=','q'),rt(hB(E,'ma'),'mr')),{from:{ma:'ka',mr:'kr1'},dur2:1300}); await S.wait(800);
  if(E.g) return restrict(S,{cx:LX+60,y:L6[2]+66,s:24},geq('x',1));
  await S.show('main',row(P,opr('=','q'),rt(hB(E,'ma'),'mr'),opr('=','q9'),num(Math.sqrt(E.a),'res')),{fade:900}); await S.wait(300);
  await S.glow('res');
}

const KIND={
  sq:{start:startSq,btn:E=>num(E.n,'b','cA'),run:runSq},
  bet:{start:startBet,run:runBet},
  up:{start:startUp,run:runUp},
  down:{start:startDown,run:runDown},
  gen:{start:startGen,btn:()=>rt(V('A','gA','cO'),'r'),run:runGen},
  pm:{start:startPM,run:runPM},
  p2:{start:startP2,run:runP2},
  inv:{start:startInv,run:runInv},
  quot:{start:startQuot,run:runQuot},
  half:{start:startHalf,run:runHalf},
};
const SECTIONS={
  sq:[...Array(10)].map((_,i)=>['sq',{n:i+1}]),
  bet:[['bet',{N:20,d:0}],['bet',{N:10,d:1}],['bet',{N:30,d:2}],['bet',{N:2,d:3}]],
  ten:[['up',{d:2,z:1}],['up',{d:8,z:1}],['up',{d:3,z:2}],['down',{d:5,z:1}],['down',{d:7,z:1}],['gen',{}]],
  prod:[['pm',{a:18,b:2}],['p2',{a:9,b:100}],['pm',{a:27,b:3}],['pm',{a:2,b:50}],['p2',{a:25,b:10000}]],
  quot:[['inv',{d:5}],['inv',{d:8}],['inv',{g:true}],['quot',{a:9,b:49}],['quot',{a:16,b:81}],['quot',{g:true}]],
  half:[['half',{a:9}],['half',{a:49}],['half',{a:100}],['half',{g:true}]],
};
/* ───────── static pictures ───────── */
function svgStack(trees,s,gap=4,pad=6){
  const Ls=trees.map(t=>lay(t,s)), w=Math.max(...Ls.map(L=>L.w))+2*pad; let y=pad; const pos=[];
  Ls.forEach(L=>{ y+=L.asc; pos.push(y); y+=L.desc+gap; });
  const h=y-gap+pad, svg=el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,class:'ic','aria-hidden':'true'});
  Ls.forEach((L,i)=>{ const x0=(w-L.w)/2; L.leaves.forEach(l=>mkLeaf(svg,shift(l,x0,pos[i]))); });
  return {svg,w,h};
}
const svgOf=(tree,s,pad)=>svgStack([tree],s,4,pad).svg;
function say(n){
  if(n.t==='n'||n.t==='o') return n.text;
  if(n.t==='d') return DM;
  if(n.t==='R') return '√('+say(n.c)+')';
  if(n.t==='r') return n.ch.map(say).join('').replace(/([·/=+−])/g,' $1 ').replace(/\s+/g,' ').trim();
  if(n.t==='p') return say(n.b)+'^'+(n.e.t!=='n'?'('+say(n.e)+')':say(n.e));
  if(n.t==='f') return '('+say(n.nu)+') / ('+say(n.de)+')';
  if(n.t==='P') return '('+say(n.c)+')';
  return '';
}
// the legend: a square of 3 by 3 cells, its side and its area
function legend(){
  const c=20, x0=36, y0=6, n=3, eq=lay(row(num(3,null,'cA'),opr('·'),num(3,null,'cA'),opr('='),num(9,null,'cO')),26);
  const w=x0+n*c+34+eq.w+6, h=y0+n*c+30, svg=el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,class:'ic','aria-hidden':'true'});
  for(let i=0;i<n;i++) for(let j=0;j<n;j++) el('rect',{x:x0+i*c,y:y0+j*c,width:c,height:c,class:'cell'},svg);
  mkLeaf(svg,{kind:'t',text:'3',cls:'cA',x:x0+n*c/2,y:y0+n*c+23,s:20});
  mkLeaf(svg,{kind:'t',text:'3',cls:'cA',x:x0-14,y:y0+n*c/2+7,s:20});
  eq.leaves.forEach(l=>mkLeaf(svg,shift(l,x0+n*c+34,y0+n*c/2+9)));
  return svg;
}
function statics(){
  const x=()=>V('x',null,'cA'), y=()=>V('y',null,'cB'), two=()=>num(2,null,'cF');
  document.getElementById('ops').replaceChildren(svgOf(row(pw(x(),two()),cellN(56),rt(x())),64,2));
  document.getElementById('legend').replaceChildren(legend());
  // the decimal mark: point or comma
  const sw=document.getElementById('dmsw'); sw.replaceChildren();
  [',','.'].forEach(c=>{ const bt=document.createElement('button'); bt.type='button'; bt.setAttribute('aria-label','0'+c+'5'); bt.setAttribute('aria-pressed',DM===c);
    bt.className=DM===c?'on':''; const sv=DM; DM=c; bt.appendChild(svgOf(row(num(0),dmk(),num(5)),18)); DM=sv;
    bt.addEventListener('click',()=>setDM(c)); sw.appendChild(bt); });
  const G={sq:rt(pw(x(),two())),bet:rt(num(2)),ten:pw(num(10,null,'cF'),two()),
    prod:rt(row(x(),opr('·'),y())),quot:rt(frc(x(),y())),half:pw(x(),half(''))};
  document.querySelectorAll('.sec').forEach(sec=>{
    const sv=svgOf(sec.dataset.sum?opr('='):G[sec.dataset.sec],44,2);   /* one size for every symbol */
    sec.querySelector('.glyph').replaceChildren(sv); });
  const S24=t=>svgOf(t,24), red=t=>svgOf(t,15);
  const cR=(v,op='≥')=>row(V(v,null,'cR'),opr(op,null,'cR'),num(0,null,'cR'));
  const pair=(t,...rs)=>{ const p=document.createElement('span'); p.className='rpair'; p.append(S24(t),red(row(rs.flatMap((r,i)=>i?[cellN(12),r]:[r])))); return p; };
  // a rule with its conditions written underneath
  const under=(t,...rs)=>{ const p=document.createElement('span'); p.className='rcol'; p.append(S24(t),red(row(rs.flatMap((r,i)=>i?[cellN(12),r]:[r])))); return p; };
  const R=[
    [pair(row(rt(x()),opr('·'),rt(x()),opr('='),x()),cR('x'))],
    [pair(row(pw(par(rt(x())),two()),opr('='),x()),cR('x')), pair(row(rt(pw(x(),two())),opr('='),x()),cR('x'))],
    [under(row(rt(x()),opr('·'),rt(y()),opr('='),rt(row(x(),opr('·'),y()))),cR('x'),cR('y')),
     under(row(rt(frc(x(),y())),opr('='),frc(rt(x()),rt(y()))),cR('x'),cR('y','>'))],
    [pair(row(pw(x(),half('')),opr('='),rt(x())),cR('x'))],
  ];
  const box=document.getElementById('rules'); box.replaceChildren();
  R.forEach(items=>{ const d=document.createElement('div'); d.className='rrow'; d.append(...items); box.appendChild(d); });
}

/* ───────── wiring ───────── */
let last=null, active=null; const stages=[];
// while an animation plays, the rest of the page steps back
let releaseT=null;
let dropT=null;
function setFocus(sec){
  clearTimeout(releaseT); clearTimeout(dropT);
  const prev=active; active=sec;
  if(sec){ document.querySelectorAll('.sec.active').forEach(x=>{ if(x!==sec) x.classList.remove('active'); }); sec.classList.add('active'); }
  // the stage that just played stays on top of the dimmer until the dimmer has faded away
  else if(prev) dropT=setTimeout(()=>prev.classList.remove('active'),2100);
  document.body.classList.toggle('focusing',!!sec);
}
// a new decimal mark: everything with decimals is redrawn
function setDM(c){
  if(c===DM) return; DM=c; try{ localStorage.setItem('wl-decimal-mark',c); }catch(e){}
  statics(); drawForms(); stages.forEach(q=>q.reset()); setFocus(null);
}
// the half power as a fraction or as a decimal
function setForm(f){
  if(f===HF) return; HF=f; try{ localStorage.setItem('wl-half',f); }catch(e){}
  statics(); drawForms(); stages.forEach(q=>{ if(q.key==='half') q.reset(); }); if(active&&active.dataset.sec==='half') setFocus(null);
}
function drawForms(){
  const box=document.getElementById('hsw'); if(!box) return; box.replaceChildren();
  ['f','d'].forEach(f=>{ const on=HF===f, bt=document.createElement('button'); bt.type='button';
    bt.className=on?'on':''; bt.setAttribute('aria-pressed',on); bt.setAttribute('aria-label',f==='f'?'1/2':'0'+DM+'5');
    const sh=HF; HF=f; bt.appendChild(svgOf(half('x'),f==='f'?17:20)); HF=sh;
    bt.addEventListener('click',()=>setForm(f)); box.appendChild(bt); });
}
// space bar pauses / resumes the animation that was started last
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||!last||e.target.closest('button,input,textarea')) return;
  e.preventDefault(); last.paused?last.resume():last.pause(); stages.forEach(q=>q.ppShow());
});
statics(); drawForms();
document.querySelectorAll('[data-sec]').forEach(sec=>{
  const key=sec.dataset.sec, list=SECTIONS[key], st=new Stage(sec.querySelector('svg.stage'));
  const exBar=sec.querySelector('.exs'), rep=sec.querySelector('.replay');
  let cur=null;
  const pp=document.createElement('button'); pp.type='button'; pp.className='replay pp'; rep.before(pp);
  const ICO_PAUSE='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="2" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="5" height="16" rx="1.5" fill="currentColor"/></svg>';
  const ICO_PLAY='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2.5 L16 10 L3 17.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const ppShow=()=>{ pp.innerHTML=st.paused?ICO_PLAY:ICO_PAUSE; pp.setAttribute('aria-label',st.paused?'▶':'❚❚'); pp.setAttribute('aria-pressed',st.paused); };
  pp.addEventListener('click',()=>{ st.paused?st.resume():st.pause(); ppShow(); last=st; });
  st.onplay=focus=>{ last=st; setTimeout(ppShow); setFocus(focus?sec:(active===sec?null:active)); };
  st.onend=()=>{ clearTimeout(releaseT); releaseT=setTimeout(()=>{ if(active===sec) setFocus(null); },1300); };
  const setRep=v=>{ rep.hidden=v; pp.hidden=v; }; setRep(true);
  const exBtns=[];
  const mark=i=>exBtns.forEach((b,j)=>{ b.classList.toggle('on',i===j); b.setAttribute('aria-pressed',i===j); });
  const run=i=>{ const [k,E]=list[i]; return st.play(S=>KIND[k].run(S,E),false,true); };
  const pic=(k,E)=>(KIND[k].btn||KIND[k].start)(E);
  const draw=()=>list.forEach(([k,E],i)=>{ const b=exBtns[i]; b.setAttribute('aria-label',say(pic(k,E))); b.replaceChildren(svgOf(pic(k,E),20)); });
  list.forEach((_,i)=>{
    const b=document.createElement('button'); b.type='button'; b.id=`ex-${key}-${i}`;
    b.addEventListener('click',()=>{ cur=i; mark(i); setRep(false); run(i); });
    exBar.appendChild(b); exBtns.push(b);
  });
  draw();
  rep.addEventListener('click',()=>{ if(cur!==null) run(cur); });
  // a new form or decimal mark: redraw the buttons and clear the stage
  const reset=()=>{ st.resume(); st.gen++; st.svg.textContent=''; cur=null; mark(-1); setRep(true); draw(); };
  stages.push({st,ppShow,reset,key});
});
</script>
