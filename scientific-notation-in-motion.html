/* Layout: one stage per idea. Expression on top, the working below it. Orange = first mantissa, blue = second mantissa, green = first exponent and the counts, purple = second exponent, red = the rule 1 ≤ a < 10. */

  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#172031; --mute:#7D879A; --rule:#D3D9E2; --dim:rgba(16,22,34,.16);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --panel:#161A21; --ink:#E6E9EF; --mute:#77839A; --rule:#2B323E; --dim:rgba(0,0,0,.45);
  --cA:#FF8A42; --cB:#6E97FF; --cF:#34C98A; --cO:#B08CFF; --cR:#FF6B6B; color-scheme:dark}}

@media (max-width:640px){.sec{grid-template-columns:minmax(0,1fr)}.glyph{justify-content:flex-start;padding-top:0}}

svg.stage{display:block;width:100%;height:auto}
.bar,.methods{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--rule);align-items:center}
.methods{justify-content:center;gap:14px;background:var(--bg)}

svg text{font-family:var(--font);font-weight:600}
.lf{fill:var(--ink);transition:fill .6s}

.lf.cA{fill:var(--cA)} .lf.cB{fill:var(--cB)} .lf.cF{fill:var(--cF)} .lf.cO{fill:var(--cO)} .lf.cR{fill:var(--cR)} .lf.mut{fill:var(--mute)}
.lbar.cA,.lpath.cA{stroke:var(--cA)} .lbar.cB,.lpath.cB{stroke:var(--cB)} .lbar.cF,.lpath.cF{stroke:var(--cF)} .lbar.cO,.lpath.cO{stroke:var(--cO)}
.lf.dim{fill:var(--rule)} .lbar.dim,.lpath.dim{stroke:var(--rule)}

<script>
const NS='http://www.w3.org/2000/svg', CANCEL=Symbol('cancel');
const RM=false;
const CX=360, CW=.62;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=t=>Math.max(0,Math.min(1,t));
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ───────── expression trees ───────── */
const num=(t,key,cls)=>({t:'n',text:String(t),key,cls:cls||''});
const opr=(t,key,cls)=>({t:'o',text:t,key,cls:cls||''});
const cellN=(w,ch)=>({t:'c',w,ch});
const row=(...ch)=>({t:'r',ch:ch.flat(9).filter(Boolean)});
function frc(a,b,key,cls){ cls=cls||''; if(typeof a!=='object') a=num(a,key+'n',cls); if(typeof b!=='object') b=num(b,key+'d',cls); return {t:'f',nu:a,de:b,key,cls}; }
const pw=(b,e)=>({t:'p',b,e});                                 // power: base with a raised exponent
const brc=(c,lab,dir,key,cls)=>({t:'B',c,lab,dir,key,cls:cls||''}); // under- ('u') or overbrace ('o') with a count
const par=(c,key)=>({t:'P',c,key});                            // brackets that grow to fit
const strike=n=>({...n,strike:true});
// the decimal mark (point or comma) is the viewer's choice
let DM=','; try{ DM=localStorage.getItem('wl-decimal-mark')||','; }catch(e){}   // the comma unless the viewer has picked the point
if(DM!=='.'&&DM!==',') DM=',';
const dmk=(key,cls)=>({t:'d',key,cls:cls||''});   // the decimal mark, narrow so the digits stay close
const arr=key=>({t:'A',key});                      // a small arrow
const isV=x=>typeof x==='string'&&/^[a-z]$/.test(x);
const V=(t,key,cls)=>num(t,key,((cls||'')+' it').trim());
const N=(x,key,cls)=>isV(x)?V(x,key,cls):num(x,key,cls);
const X=(e,key,cls)=>typeof e==='object'?e:N(e,key,cls);

const ks=k=>k!=null?k:undefined;
function shift(l,dx,dy){ const q={...l};
  if(q.kind==='p'){ q.x1+=dx; q.x2+=dx; q.y1+=dy; q.y2+=dy; }
  else { if(q.kind==='b'){ q.x1+=dx; q.x2+=dx; } else q.x+=dx; q.y+=dy; }
  return q; }
function lay(node,s){
  if(node.t==='d'){ const w=.36*s; return {w,asc:.74*s,desc:.16*s,leaves:[{key:node.key,kind:'t',text:DM,cls:node.cls,x:w/2,y:0,s}]}; }
  if(node.t==='A'){ const w=1.1*s, y=-.3*s; return {w,asc:.5*s,desc:0,leaves:[{key:node.key,kind:'p',shape:'ar',cls:'',x1:.15*s,x2:w-.15*s,y1:y,y2:y,s}]}; }
  if(node.t==='o'&&node.text==='/'){   // division: a large slash
    const k=1.55, tw=CW*k*s, pad=.1*s, sh=.2*s;
    return {w:tw+2*pad,asc:.74*k*s-sh,desc:sh+.06*s,leaves:[{key:node.key,kind:'t',text:'/',cls:node.cls,x:pad+tw/2,y:sh,s:k*s}]};
  }
  if(node.t==='n'||node.t==='o'){
    const ell=node.text==='⋯', tw=(ell?1.3:[...node.text].length)*CW*s, pad=node.t==='o'?((node.text==='·'||ell)?.14:.34)*s:0;
    const leaves=[{key:node.key,kind:'t',text:node.text,cls:node.cls,x:pad+tw/2,y:0,s}];
    if(node.strike) leaves.push({key:node.key!=null?node.key+'.x':undefined,kind:'p',shape:'x',cls:'',x1:pad-.14*s,x2:pad+tw+.14*s,y1:.12*s,y2:-.84*s,s});
    return {w:tw+2*pad,asc:.74*s,desc:.06*s,leaves};
  }
  if(node.t==='c'){
    if(!node.ch) return {w:node.w,asc:0,desc:0,leaves:[]};
    const L=lay(node.ch,s); return {w:node.w,asc:L.asc,desc:L.desc,leaves:L.leaves.map(l=>shift(l,(node.w-L.w)/2,0))};
  }
  if(node.t==='r'){
    let x=0,asc=0,desc=0; const leaves=[];
    for(const ch of node.ch){ const L=lay(ch,s); for(const l of L.leaves) leaves.push(shift(l,x,0)); x+=L.w; asc=Math.max(asc,L.asc); desc=Math.max(desc,L.desc); }
    return {w:x,asc,desc,leaves};
  }
  if(node.t==='p'){
    const B=lay(node.b,s), es=.62*s, E=lay(node.e,es), rise=Math.max(.4*s,B.asc-.5*es), gx=.04*s;
    return {w:B.w+gx+E.w+.05*s,asc:Math.max(B.asc,rise+E.asc),desc:Math.max(B.desc,E.desc-rise),
      leaves:[...B.leaves,...E.leaves.map(l=>shift(l,B.w+gx,-rise))]};
  }
  if(node.t==='B'){
    const C=lay(node.c,s), ls=Math.max(.62*s,16), Lb=lay(node.lab,ls), w=Math.max(C.w,Lb.w), cx=(w-C.w)/2, lx=(w-Lb.w)/2;
    const g=.14*s, bh=.3*s, ins=.05*s, leaves=C.leaves.map(l=>shift(l,cx,0)), key=node.key!=null?node.key+'.br':undefined;
    if(node.dir==='u'){
      const y1=C.desc+g, y2=y1+bh, yl=y2+.14*s+Lb.asc;
      leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
      Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
      return {w,asc:C.asc,desc:yl+Lb.desc,leaves};
    }
    const y1=-C.asc-g, y2=y1-bh, yl=y2-.14*s-Lb.desc;
    leaves.push({key,kind:'p',shape:'br',cls:node.cls,x1:cx+ins,x2:cx+C.w-ins,y1,y2,s});
    Lb.leaves.forEach(l=>leaves.push(shift(l,lx,yl)));
    return {w,asc:-yl+Lb.asc,desc:C.desc,leaves};
  }
  if(node.t==='P'){
    const C=lay(node.c,s), pw_=.36*s, asc=Math.max(C.asc,.74*s)+.1*s, desc=Math.max(C.desc,.06*s)+.16*s, kk=node.key;
    const leaves=C.leaves.map(l=>shift(l,pw_,0));
    leaves.push({key:kk!=null?kk+'.pl':undefined,kind:'p',shape:'pl',cls:'',x1:.05*s,x2:pw_-.02*s,y1:-asc,y2:desc,s});
    leaves.push({key:kk!=null?kk+'.pr':undefined,kind:'p',shape:'pr',cls:'',x1:pw_+C.w+.02*s,x2:2*pw_+C.w-.05*s,y1:-asc,y2:desc,s});
    return {w:C.w+2*pw_,asc,desc,leaves};
  }
  const T=lay(node.nu,s), B=lay(node.de,s), pad=.24*s, gap=(node.gap??.2)*s, ax=.3*s, w=Math.max(T.w,B.w)+2*pad;
  const yT=-ax-gap-T.desc, yB=-ax+gap+B.asc, leaves=[];
  for(const l of T.leaves) leaves.push(shift(l,(w-T.w)/2,yT));
  for(const l of B.leaves) leaves.push(shift(l,(w-B.w)/2,yB));
  leaves.push({key:node.key!=null?node.key+'.bar':undefined,kind:'b',cls:node.cls,x1:pad*.4,x2:w-pad*.4,y:-ax,s});
  return {w,asc:-yT+T.asc,desc:yB+B.desc,leaves};
}
function pathD(l){
  const {x1,x2,y1,y2}=l, ym=(y1+y2)/2;
  if(l.shape==='x') return `M${x1} ${y1}L${x2} ${y2}`;
  if(l.shape==='ar'){ const h=.18*l.s; return `M${x1} ${y1}L${x2} ${y1}M${x2-h} ${y1-h}L${x2} ${y1}L${x2-h} ${y1+h}`; }
  if(l.shape==='pl') return `M${x2} ${y1}Q${2*x1-x2} ${ym} ${x2} ${y2}`;
  if(l.shape==='pr') return `M${x1} ${y1}Q${2*x2-x1} ${ym} ${x1} ${y2}`;
  const xm=(x1+x2)/2, q=Math.min(Math.abs(y2-y1)*.9,(x2-x1)/4);
  return `M${x1} ${y1}Q${x1} ${ym} ${x1+q} ${ym}L${xm-q} ${ym}Q${xm} ${ym} ${xm} ${y2}Q${xm} ${ym} ${xm+q} ${ym}L${x2-q} ${ym}Q${x2} ${ym} ${x2} ${y1}`;
}
const klassOf=l=>(l.kind==='t'?'lf ':l.kind==='b'?'lbar ':'lpath ')+l.cls;
function mkLeaf(parent,l){
  const e=el(l.kind==='t'?'text':l.kind==='b'?'line':'path',{class:klassOf(l)},parent);
  if(l.kind==='t'){ e.setAttribute('text-anchor','middle'); e.textContent=l.text; }
  setLeaf(e,l); return e;
}
function setLeaf(e,l){
  if(l.kind==='t'){ e.setAttribute('x',l.x); e.setAttribute('y',l.y); e.setAttribute('font-size',l.s); }
  else if(l.kind==='b'){ e.setAttribute('x1',l.x1); e.setAttribute('x2',l.x2); e.setAttribute('y1',l.y); e.setAttribute('y2',l.y); e.setAttribute('stroke-width',Math.max(1.6,l.s*.07)); }
  else { e.setAttribute('d',pathD(l)); e.setAttribute('stroke-width',Math.max(1.6,l.s*(l.shape==='br'?.06:.075))); }
}
function mixLeaf(a,b,t,dx,dy){
  const q={...b};
  if(b.kind==='t'){ q.x=lerp(a.x,b.x,t)+(dx||0); q.y=lerp(a.y,b.y,t)+(dy||0); q.s=lerp(a.s,b.s,t); }
  else if(b.kind==='b'){ q.x1=lerp(a.x1,b.x1,t); q.x2=lerp(a.x2,b.x2,t); q.y=lerp(a.y,b.y,t); }
  else { q.x1=lerp(a.x1,b.x1,t); q.x2=lerp(a.x2,b.x2,t); q.y1=lerp(a.y1,b.y1,t); q.y2=lerp(a.y2,b.y2,t); q.s=lerp(a.s,b.s,t); }
  return q;
}
const sameLeaf=(a,b)=>a.kind==='t'?(a.x===b.x&&a.y===b.y&&a.s===b.s):a.kind==='b'?(a.x1===b.x1&&a.x2===b.x2&&a.y===b.y):(a.x1===b.x1&&a.x2===b.x2&&a.y1===b.y1&&a.y2===b.y2);
const mid=l=>l.kind==='t'?[l.x,l.y-.32*l.s]:l.kind==='b'?[(l.x1+l.x2)/2,l.y]:[(l.x1+l.x2)/2,(l.y1+l.y2)/2];

/* products:  a · a · a  or  a · a · ⋯ · a · a  (ids ending in 'e' are the dots ⋯) */
const isE=id=>id.endsWith('e');
const SL=c=>typeof c==='number'?[...Array(c)].map((_,i)=>String(i)):['0','1','e','3','4'];
function prod(P,ids,fac,sep){ const out=[]; ids.forEach((id,i)=>{ if(i) out.push(sep?sep(ids[i-1]):opr('·',P+'m'+ids[i-1])); out.push(isE(id)?opr('⋯',P+id):fac(id)); }); return row(out); }
const W=(node,s)=>lay(node,s).w;
const ph=(node,s)=>cellN(W(node,s));
const cps=(P,ids,src)=>Object.fromEntries(ids.filter(i=>!isE(i)).map(i=>[P+i,src]));
// numerator and denominator padded on the left to one width, so matching factors stand straight above each other at the right
const G=f=>({...f,gap:.42});   // roomier fraction for long rows of factors
function fracL(T,B,key,s){ const a=W(T,s), b=W(B,s); return G(frc(row(a<b?cellN(b-a):null,T),row(b<a?cellN(a-b):null,B),key)); }

/* ───────── stage + animation context ───────── */
class Stage{
  constructor(svg){ this.svg=svg; this.gen=0; this.introDone=false; this.acc=0; this.pausedAt=null; }
  now(){ return (this.pausedAt??performance.now())-this.acc; }
  pause(){ if(this.pausedAt==null) this.pausedAt=performance.now(); }
  resume(){ if(this.pausedAt!=null){ this.acc+=performance.now()-this.pausedAt; this.pausedAt=null; } }

class Ctx{

  /* morph one line of math into a new tree: shared keys glide, changed numbers crossfade, copies grow out of their originals, new parts fade in last */
  async show(line,tree,op={}){

/* ───────── decimal numbers: the digits stand still and the decimal mark hops between them ───────── */
// D = {P, ds:[{d,k,c}], pt: digits before the mark, show: mark visible, nk: counter for new zeros}
function mkD(str,P,cls){
  const [i,f='']=String(str).split('.'), all=[...(i+f)], first=all.findIndex(c=>c!=='0'), last=all.length-1-[...all].reverse().findIndex(c=>c!=='0');

const copyD=D=>({...D,ds:D.ds.map(q=>({...q}))});

const padL=D=>{ D.ds.unshift({d:'0',k:D.P+'z'+(D.nk++),c:''}); D.pt++; };

// the digits and the mark as one row; br puts a brace under items a … b−1
function decN(D,br){
  const it=[]; D.ds.forEach((q,j)=>{ if(j===D.pt&&D.show) it.push(dmk(D.P+'p')); it.push(num(q.d,q.k,q.c)); });
  if(D.show&&D.pt>=D.ds.length) it.push(dmk(D.P+'p'));

const fmt=x=>String(+x.toFixed(10));            // 2.6999999… → "2.7"
const sgn=n=>n<0?'−'+(-n):String(n);
const T10=P=>row(num(1,P+'1'),num(0,P+'0'));     // a ten as two digits, so its zero can travel
const ex10=(n,P)=>n<0?row(num('−',P+'m','cF'),num(-n,P,'cF')):num(n,P,'cF');

/* ───────── 1 · powers of ten ───────── */
const startTen=E=>row(pw(T10('pb'),ex10(E.n,'pe')));
async function runTen(S,E){
  const n=Math.abs(E.n), neg=E.n<0, s=32, P0=pw(T10('pb'),ex10(E.n,'pe')), ids=[...Array(n)].map((_,i)=>i);
  await S.begin(row(P0),{cx:CX,y:92,s:34});
  const part=(P,k)=>row(ids.slice(0,k).map(i=>neg?[opr('/',P+'s'+i),T10(P+i)]:[i?opr('·',P+'m'+(i-1)):null,T10(P+i)]));

  S.cfg('w',{cx:L,y:214,s,al:'l'}); S.cfg('r',{cx:L,y:346,s,al:'l'});

/* ───────── 2–3 · decimal form → scientific notation ───────── */

/* ───────── 4 · scientific notation → decimal form ───────── */

  await S.show('w',wl(pw(row(num(1,'f1'),num(0,big?'fz1':'fz0')),ex10(E.e,'fl'))),{from,dur:1300}); await S.wait(900);
  // the power of ten written out: the exponent counts its zeros
  await S.show('w',wl(facTree(big,n,true)),{dur:1300,fade:800,curve:big?null:{f1:{y:-.9*s}}}); await S.wait(1300);
  await S.show('w',wl(),{fade:700}); await S.wait(600);
  if(!D.show){ D.show=true; await S.show('w',wl(),{fade:700}); await S.wait(600); }
  // each hop of the mark uses up one zero of the factor; past the last digit the mark hops over empty space and draws a zero there
  for(let i=0;i<n;i++){
    if(big){ if(D.pt>=D.ds.length) padR(D); D.pt++; }
    else if(D.pt===0){ padL(D); D.pt--; } else D.pt--;
    k--; await S.show('w',wl(),{dur:900,sync:true,curve:{wp:{y:-.85*s}}}); await S.wait(300);
  }
  await S.wait(700);
  if(big) D.show=false; else padL(D);   // small numbers: the zero in the ones place comes last
  await S.show('w',row(opr('=','we'),cellN(gap()),decN(D)),{dur:900,fade:800}); await S.wait(900);
  const [Dr,fr]=cloneD(D,'R'), br={a:big?1:0,b:big?Dr.ds.length:n+1,lab:num(n,'ql','cF'),key:'qb'};
  await S.show('main',row(cellN(eqW),P0,opr('=','mq'),decN(Dr,br)),{from:{...fr,ql:'pe'},dur:1400});
  await S.wait(500); await S.all(S.glow('pe'),S.glow('ql'));
}

/* a ten moves between the mantissa and the power of ten: out (24 → 2.4, exponent + 1) or in (0.5 → 5, exponent − 1) */
async function moveTen(S,line,build,D,bump,dir,pulse,tk,ek){
  const s=S.lines[line].s, keys=()=>D.ds.map(q=>q.k).concat(D.show?[D.P+'p']:[]);
  const cen=ks=>{ const ps=ks.map(k=>S.cur.get(k)).filter(Boolean).map(c=>mid(c.spec)), xs=ps.map(p=>p[0]); return [(Math.min(...xs)+Math.max(...xs))/2,ps.reduce((a,p)=>a+p[1],0)/ps.length]; };
  const hop={curve:{[D.P+'p']:{y:-.85*s}}};
  // the mantissa breaks the rule 1 ≤ a < 10
  if(pulse){ await S.pulseRed(keys()); await S.wait(500); }
  if(dir==='out'){
    if(!D.show){ D.show=true; await S.show(line,build(),{fade:600}); await S.wait(300); }
    const from=cen(keys()), to=cen([tk]);
    D.pt--; if(D.pt===0) padL(D);
    await S.all(S.show(line,build(),{dur:900,fade:500,...hop}),S.flyTen(from,to,s));
    bump(1); await S.show(line,build(),{dur:700}); await S.glow(ek,900);
  } else {
    if(!D.show){ D.show=true; await S.show(line,build(),{fade:600}); await S.wait(300); }
    const fly=S.flyTen(cen([tk]),cen(keys()),s);
    bump(-1); await S.show(line,build(),{dur:700}); await fly;
    D.pt++; if(D.pt>D.ds.length) padR(D);
    await S.show(line,build(),{dur:800,fade:500,...hop});
  }
  await S.wait(600); trimD(D); await S.show(line,build(),{dur:900}); await S.wait(600);
}

/* ───────── 5–6 · multiplication and division ───────── */
const sci=(str,e,P,cm,ce)=>row(decN(mkD(str,P,cm)),opr('·',P+'o'),pw(num(10,P+'t'),num(sgn(e),P+'e',ce)));
const startOp=(E,op)=>op==='·'?row(par(sci(E.a,E.m,'a','cA','cF'),'pa'),opr('·','mo'),par(sci(E.b,E.n,'b','cB','cO'),'pb'))
                               :frc(sci(E.a,E.m,'a','cA','cF'),sci(E.b,E.n,'b','cB','cO'),'M');
const dFrom=(D,src)=>{ const f={[D.P+'p']:src.P+'p'}; D.ds.forEach((q,j)=>{ f[q.k]=src.ds[j].k; }); return f; };
async function runOp(S,E,op){
  const s=32, mul=op==='·', M0=startOp(E,op), DA=mkD(E.a,'A','cA'), DB=mkD(E.b,'B','cB');
  const r=mul?(+E.a)*(+E.b):(+E.a)/(+E.b), D=mkD(fmt(r),'R','');
  let e=mul?E.m+E.n:E.m-E.n, st=0;
  await S.begin(row(M0),{cx:CX,y:mul?100:112,s});
  S.cfg('w',{cx:CX,y:mul?236:300,s});
  const pA=()=>pw(num(10,'TA'),num(sgn(E.m),'EA','cF')), pB=()=>pw(num(10,'TB'),num(sgn(E.n),'EB','cO'));
  const eB=()=>E.n<0?par(num(sgn(E.n),'EB','cO'),'EP'):num(sgn(E.n),'EB','cO');
  const mant=()=>st<1?(mul?row(decN(DA),opr('·','o1'),decN(DB)):frc(decN(DA),decN(DB),'F1')):decN(D);
  const tens=()=>st<2?(mul?row(pA(),opr('·','o3'),pB()):frc(pA(),pB(),'F2'))
    :pw(num(10,'TA'),st<3?row(num(sgn(E.m),'EA','cF'),opr(mul?'+':'−','Eo'),eB()):num(sgn(e),'EA'));
  const wl=()=>row(opr('=','we'),mant(),opr('·','o2'),tens());
  // mantissas together, powers of ten together
  const sA=mkD(E.a,'a'), sB=mkD(E.b,'b');
  const from={...dFrom(DA,sA),...dFrom(DB,sB),TA:'at',EA:'ae',TB:'bt',EB:'be'};
  const curve={}; if(mul){ DB.ds.forEach(q=>{ curve[q.k]={y:44}; }); curve.Bp={y:44}; curve.TA={y:-30}; curve.EA={y:-30}; }
  await S.show('w',wl(),{from,curve,dur:1500}); await S.wait(1300);
  st=1; await S.show('w',wl(),{dur:900,fade:900}); await S.wait(1000);
  st=2; await S.show('w',wl(),{dur:1300,fade:700}); await S.wait(1000);
  st=3; await S.show('w',wl(),{dur:1000}); await S.wait(900);
  while(valD(D)>=10||valD(D)<1) await moveTen(S,'w',wl,D,d=>{ e+=d; },valD(D)>=10?'out':'in',true,'TA','EA');
  const [Dq,fq]=cloneD(D,'Q');
  await S.show('main',row(M0,opr('=','mq'),decN(Dq),opr('·','qo'),pw(num(10,'QT'),num(sgn(e),'QE'))),{from:{...fq,qo:'o2',QT:'TA',QE:'EA'},dur:1400});
}

/* ───────── 7 · addition and subtraction ───────── */
const startAdd=E=>row(sci(E.a,E.m,'a','cA','cF'),opr(E.op,'mo'),sci(E.b,E.n,'b','cB','cO'));
async function runAdd(S,E){
  const s=32, M0=startAdd(E), DA=mkD(E.a,'A','cA'), DB=mkD(E.b,'B','cB');
  let eB=E.n, e=E.m, ink=false;
  await S.begin(row(M0),{cx:CX,y:92,s}); S.cfg('w',{cx:CX,y:214,s}); S.cfg('r',{cx:CX,y:340,s});
  const pA=()=>pw(num(10,'TA'),num(sgn(e),'EA',ink?'':'cF')), pB=()=>pw(num(10,'TB'),num(sgn(eB),'EB','cO'));
  const w0=()=>row(opr('=','we'),decN(DA),opr('·','oA'),pA(),opr(E.op,'oo'),decN(DB),opr('·','oB'),pB());
  const from={...dFrom(DA,mkD(E.a,'a')),...dFrom(DB,mkD(E.b,'b')),oA:'ao',TA:'at',EA:'ae',oo:'mo',oB:'bo',TB:'bt',EB:'be'};
  await S.show('w',w0(),{from,dur:1400}); await S.wait(1200);
  // first the powers of ten must match: the smaller one takes a ten from its mantissa
  if(eB!==e){
    if(E.via==='A') while(e>eB) await moveTen(S,'w',w0,DA,d=>{ e+=d; },'in',false,'TA','EA');
    else while(eB<e) await moveTen(S,'w',w0,DB,d=>{ eB+=d; },'out',false,'TB','EB');
    await S.all(S.wiggle(['TA','EA']),S.wiggle(['TB','EB'])); await S.wait(700);
  }
  // one power of ten for both
  const lift={TA:{y:-40},EA:{y:-40},oA:{y:-40}};
  await S.show('w',row(opr('=','we'),par(row(decN(DA),opr(E.op,'oo'),decN(DB)),'wP'),opr('·','oA'),pA()),{dur:1400,curve:lift}); await S.wait(1000);
  // the mantissas on their own, while the power of ten waits
  S.dimK(['TA','EA','oA'],true);
  const [RA,fa]=cloneD(DA,'qa'), [RB,fb]=cloneD(DB,'qb'), r=E.op==='+'?valD(DA)+valD(DB):valD(DA)-valD(DB), R=mkD(fmt(r),'S','');
  await S.show('r',row(decN(RA),opr(E.op,'qo'),decN(RB)),{from:{...fa,...fb,qo:'oo'},dur:1300}); await S.wait(900);
  await S.show('r',row(decN(RA),opr(E.op,'qo'),decN(RB),opr('=','qe'),decN(R)),{dur:900,fade:900}); await S.wait(1200);
  // and back next to its power of ten
  const [U,fu]=cloneD(R,'U'); ink=true; S.dimK(['TA','EA','oA'],false);
  const w2=()=>row(opr('=','we'),decN(U),opr('·','oA'),pA());
  await S.show('w',w2(),{from:fu,dur:1400}); await S.wait(1000);
  while(valD(U)>=10||valD(U)<1) await moveTen(S,'w',w2,U,d=>{ e+=d; },valD(U)>=10?'out':'in',true,'TA','EA');
  // a mantissa of 1 changes nothing, so it can go
  const one=valD(U)===1;
  if(one){ await S.wiggle(U.ds.map(q=>q.k).concat(['oA']),1600); await S.show('w',row(opr('=','we'),pA()),{dur:1100}); await S.wait(900);
    await S.show('main',row(M0,opr('=','mq'),pw(num(10,'QT'),num(sgn(e),'QE'))),{from:{QT:'TA',QE:'EA'},dur:1400}); return; }
  const [Dq,fq]=cloneD(U,'Q');
  await S.show('main',row(M0,opr('=','mq'),decN(Dq),opr('·','qo2'),pw(num(10,'QT'),num(sgn(e),'QE'))),{from:{...fq,qo2:'oA',QT:'TA',QE:'EA'},dur:1400});
}

/* ───────── examples ───────── */
const KIND={
  ten:{start:startTen,run:runTen},
  sci:{start:startSci,run:runToSci},
  back:{start:startBack,run:runFromSci},
  mul:{start:E=>startOp(E,'·'),run:(S,E)=>runOp(S,E,'·')},
  div:{start:E=>row(startOp(E,'/')),run:(S,E)=>runOp(S,E,'/')},
  add:{start:startAdd,run:runAdd},
};
const SECTIONS={
  ten:[['ten',{n:3}],['ten',{n:6}],['ten',{n:-2}],['ten',{n:-4}]],
  big:[['sci',{x:'3000'}],['sci',{x:'700000'}],['sci',{x:'45000'}],['sci',{x:'2600000'}],['sci',{x:'318000'}],['sci',{x:'60800'}]],
  small:[['sci',{x:'0.004'}],['sci',{x:'0.00007'}],['sci',{x:'0.00052'}],['sci',{x:'0.036'}],['sci',{x:'0.000614'}],['sci',{x:'0.00307'}]],
  back:[['back',{m:'6',e:4}],['back',{m:'2.75',e:5}],['back',{m:'7.09',e:6}],['back',{m:'8',e:-3}],['back',{m:'4.6',e:-5}],['back',{m:'2.05',e:-4}]],
  mul:[['mul',{a:'2.5',m:3,b:'3',n:4}],['mul',{a:'4',m:5,b:'6',n:3}],['mul',{a:'2',m:6,b:'4',n:-2}],['mul',{a:'5',m:-4,b:'3',n:7}],['mul',{a:'1.5',m:-3,b:'3',n:-4}],['mul',{a:'6',m:-2,b:'7',n:-5}]],
  div:[['div',{a:'6.4',m:7,b:'2',n:3}],['div',{a:'3',m:8,b:'6',n:2}],['div',{a:'9',m:5,b:'3',n:-2}],['div',{a:'2',m:-4,b:'8',n:3}],['div',{a:'8.4',m:-5,b:'2',n:-3}],['div',{a:'1.2',m:-8,b:'4',n:-3}]],
  add:[['add',{a:'3.2',m:5,b:'4.1',n:5,op:'+'}],['add',{a:'6',m:4,b:'5',n:4,op:'−'}],['add',{a:'2.4',m:-4,b:'3',n:-5,op:'+'}],['add',{a:'9.5',m:3,b:'7',n:2,op:'+',via:'A'}],['add',{a:'5',m:-2,b:'8',n:-3,op:'−'}],['add',{a:'1',m:6,b:'2',n:4,op:'−',via:'A'}]],
};

/* ───────── static pictures ───────── */
function svgStack(trees,s,gap=4,pad=6){
  const Ls=trees.map(t=>lay(t,s)), w=Math.max(...Ls.map(L=>L.w))+2*pad; let y=pad; const pos=[];
  Ls.forEach(L=>{ y+=L.asc; pos.push(y); y+=L.desc+gap; });
  const h=y-gap+pad, svg=el('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,class:'ic','aria-hidden':'true'});
  Ls.forEach((L,i)=>{ const x0=(w-L.w)/2; L.leaves.forEach(l=>mkLeaf(svg,shift(l,x0,pos[i]))); });
  return {svg,w,h};
}
const svgOf=(tree,s,pad)=>svgStack([tree],s,4,pad).svg;
function say(n){
  if(n.t==='n'||n.t==='o') return n.text;
  if(n.t==='d') return DM;
  if(n.t==='A') return '→';
  if(n.t==='r') return n.ch.map(say).join('').replace(/([·/=+−])/g,' $1 ').replace(/\s+/g,' ').trim();
  if(n.t==='p') return say(n.b)+'^'+(n.e.t==='r'?'('+say(n.e)+')':say(n.e));
  if(n.t==='f') return '('+say(n.nu)+') / ('+say(n.de)+')';
  if(n.t==='P') return '('+say(n.c)+')';
  if(n.t==='B') return say(n.c);
  return '';
}
function statics(){
  const a=()=>V('a',null,'cA'), b=()=>V('b',null,'cB'), m=()=>V('m',null,'cF'), n=()=>V('n',null,'cO'), g=()=>V('n',null,'cF'), t=()=>num(10);
  const dec=x=>decN(mkD(x,'s'));
  document.getElementById('ops').replaceChildren(svgOf(row(a(),opr('·'),pw(t(),g())),64,2));
  document.getElementById('legend').replaceChildren(svgOf(row(pw(t(),num(3,null,'cF')),opr('='),num(1),brc(row(num(0),num(0),num(0)),num(3,null,'cF'),'u',null,'cF')),22));
  // the decimal mark: point or comma
  const sw=document.getElementById('dmsw'); sw.replaceChildren();
  [',','.'].forEach(c=>{ const bt=document.createElement('button'); bt.type='button'; bt.setAttribute('aria-label','0'+c+'5'); bt.setAttribute('aria-pressed',DM===c);
    bt.className=DM===c?'on':''; const sv=DM; DM=c; bt.appendChild(svgOf(dec('0.5'),18)); DM=sv;
    bt.addEventListener('click',()=>setDM(c)); sw.appendChild(bt); });
  const neg=()=>row(num('−',null,'cF'),g());
  const G={ten:pw(t(),g()),big:row(arr(),pw(t(),g())),small:row(arr(),pw(t(),neg())),back:row(pw(t(),row(num('±',null,'cF'),g())),arr()),
    mul:opr('·'),div:opr('/'),add:opr('±')};
  document.querySelectorAll('.sec').forEach(sec=>{
    const sv=svgOf(sec.dataset.sum?opr('='):G[sec.dataset.sec],44,2);   /* one size for every symbol */
    sec.querySelector('.glyph').replaceChildren(sv); });
  const S24=x=>svgOf(x,24), sc=(x,e)=>row(x,opr('·'),pw(t(),e));
  const rule=document.createElement('span'); rule.className='rpair';
  rule.append(S24(sc(a(),g())),svgOf(row(num(1,null,'cR'),opr('≤',null,'cR'),V('a',null,'cR'),opr('<',null,'cR'),num(10,null,'cR')),15));
  const R=[
    [S24(row(pw(t(),g()),opr('='),num(1),brc(row(num(0),opr('⋯'),num(0)),g(),'u',null,'cF'))),
     S24(row(pw(t(),neg()),opr('='),brc(row(num(0),dmk(),num(0),opr('⋯'),num(0)),g(),'u',null,'cF'),num(1)))],
    [rule],
    [S24(row(par(sc(a(),m())),opr('·'),par(sc(b(),n())),opr('='),par(row(a(),opr('·'),b())),opr('·'),pw(t(),row(m(),opr('+'),n())))),
     S24(row(frc(sc(a(),m()),sc(b(),n())),opr('='),frc(a(),b()),opr('·'),pw(t(),row(m(),opr('−'),n()))))],
    [S24(row(sc(a(),g()),opr('+'),sc(b(),g()),opr('='),par(row(a(),opr('+'),b())),opr('·'),pw(t(),g()))),
     S24(row(sc(a(),g()),opr('−'),sc(b(),g()),opr('='),par(row(a(),opr('−'),b())),opr('·'),pw(t(),g())))],
    [S24(row(sc(dec('24'),num(8)),opr('='),sc(dec('2.4'),num(9)))),
     S24(row(sc(dec('0.5'),num(6)),opr('='),sc(dec('5'),num(5))))],
  ];
  const box=document.getElementById('rules'); box.replaceChildren();
  R.forEach(items=>{ const d=document.createElement('div'); d.className='rrow'; d.append(...items); box.appendChild(d); });
}

/* ───────── wiring ───────── */
let last=null, active=null; const stages=[];
// while an animation plays, the rest of the page steps back
let releaseT=null;
let dropT=null;
function setFocus(sec){
  clearTimeout(releaseT); clearTimeout(dropT);
  const prev=active; active=sec;
  if(sec){ document.querySelectorAll('.sec.active').forEach(x=>{ if(x!==sec) x.classList.remove('active'); }); sec.classList.add('active'); }
  // the stage that just played stays on top of the dimmer until the dimmer has faded away
  else if(prev) dropT=setTimeout(()=>prev.classList.remove('active'),2100);
  document.body.classList.toggle('focusing',!!sec);
}
function setDM(c){
  if(c===DM) return; DM=c; try{ localStorage.setItem('wl-decimal-mark',c); }catch(e){}
  statics(); stages.forEach(q=>q.reset()); setFocus(null);
}
// space bar pauses / resumes the animation that was started last
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||!last||e.target.closest('button,input,textarea')) return;
  e.preventDefault(); last.paused?last.resume():last.pause(); stages.forEach(q=>q.ppShow());
});
statics();
document.querySelectorAll('[data-sec]').forEach(sec=>{
  const key=sec.dataset.sec, list=SECTIONS[key], st=new Stage(sec.querySelector('svg.stage'));
  const exBar=sec.querySelector('.exs'), rep=sec.querySelector('.replay');
  let cur=null;
  const pp=document.createElement('button'); pp.type='button'; pp.className='replay pp'; rep.before(pp);
  const ICO_PAUSE='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="2" y="2" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="5" height="16" rx="1.5" fill="currentColor"/></svg>';
  const ICO_PLAY='<svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path d="M3 2.5 L16 10 L3 17.5 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const ppShow=()=>{ pp.innerHTML=st.paused?ICO_PLAY:ICO_PAUSE; pp.setAttribute('aria-label',st.paused?'▶':'❚❚'); pp.setAttribute('aria-pressed',st.paused); };
  pp.addEventListener('click',()=>{ st.paused?st.resume():st.pause(); ppShow(); last=st; });
  st.onplay=focus=>{ last=st; setTimeout(ppShow); setFocus(focus?sec:(active===sec?null:active)); };
  st.onend=()=>{ clearTimeout(releaseT); releaseT=setTimeout(()=>{ if(active===sec) setFocus(null); },1300); };
  const setRep=v=>{ rep.hidden=v; pp.hidden=v; }; setRep(true);
  const exBtns=[];
  const mark=i=>exBtns.forEach((b,j)=>{ b.classList.toggle('on',i===j); b.setAttribute('aria-pressed',i===j); });
  const run=i=>{ const [k,E]=list[i]; return st.play(S=>KIND[k].run(S,E),false,true); };
  const draw=()=>list.forEach(([k,E],i)=>{ const b=exBtns[i]; b.setAttribute('aria-label',say(KIND[k].start(E))); b.replaceChildren(svgOf(KIND[k].start(E),20)); });
  list.forEach((_,i)=>{
    const b=document.createElement('button'); b.type='button'; b.id=`ex-${key}-${i}`;
    b.addEventListener('click',()=>{ cur=i; mark(i); setRep(false); run(i); });
    exBar.appendChild(b); exBtns.push(b);
  });
  draw();
  rep.addEventListener('click',()=>{ if(cur!==null) run(cur); });
  // a new decimal mark: redraw the buttons and clear the stage
  const reset=()=>{ st.resume(); st.gen++; st.svg.textContent=''; cur=null; mark(-1); setRep(true); draw(); };
  stages.push({st,ppShow,reset});
});
